<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Paaani | Las Palmas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* 基础设置 */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: 'Nunito', sans-serif;

    color: #59616c;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.72),
            rgba(255,255,255,0.72)
        ),
        url("paaani-bg.png");

    background-repeat: repeat;
    background-size: 300px auto;

    min-height: 100vh;
}


/* 手机页面 */

.app {
    width: 100%;
    max-width: 430px;

    margin: 0 auto;

    padding: 22px 20px 110px;
}


/* 返回按钮 */

.back-button {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.8);

    color: #59616c;

    font-size: 22px;

    cursor: pointer;

    margin-bottom: 24px;
}


/* =========================
   标题
========================= */

.page-title {
    margin: 0;

    font-size: 30px;
    font-weight: 800;

    color: #59616c;
}

.page-subtitle {
    margin: 5px 0 24px;

    font-size: 14px;

    color: #999;
}


/* =========================
   集章卡
========================= */

.stamp-card {
    background: rgba(255,255,255,0.92);

    border-radius: 22px;

    padding: 22px 18px 24px;

    box-shadow: 0 6px 20px rgba(89,97,108,0.06);
}


/* 卡片顶部 */

.stamp-card-header {
    display: flex;
    align-items: baseline;
    gap: 6px;

    margin-bottom: 22px;
}


/* 已获得 */

.stamp-card-title {
    margin: 0;

    font-size: 18px;
    font-weight: 800;

    color: #59616c;
}


/* 数字 */

.stamp-count {
    font-size: 20px;
    font-weight: 800;

    color: #F4B942;
}


/* 小说明 */

.stamp-card-text {
    font-size: 14px;
    font-weight: 600;

    color: #59616c;
}

/* =========================
   8个印章
========================= */

.stamps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    column-gap: 16px;
    row-gap: 24px;

    margin-top: 6px;

    padding: 4px 2px 8px;
}


/* 单个杯子印章 */

.stamp {
    width: 64px;
    height: 64px;

    object-fit: contain;

    display: block;
    margin: 0 auto;

    /* 未获得：淡灰色 */
    opacity: 0.32;

filter:
    brightness(0)
    saturate(0);

    border: none;
    border-radius: 0;

    transition: 0.25s;
}



/* 已获得 */
.stamp.done {
    opacity: 1;
    filter: none;

    transform: rotate(-4deg) scale(1.05);
}

/* =========================
   进度
========================= */

.stamp-progress {
    margin-top: 22px;

    font-size: 14px;
    font-weight: 700;

    color: #9a9a9a;

    text-align: center;
}


/* =========================
   提示卡片
========================= */

.reward-info {

    margin-top: 20px;

    padding: 18px;

    background: rgba(255,255,255,.85);

    border-radius: 20px;

    text-align: center;

    font-size: 14px;

    line-height: 1.6;

    color: #777;
}

</style>

</head>


<body>

<div class="app">

    <!-- 返回 -->
    <button
        class="back-button"
        onclick="history.back()">
        ←
    </button>


    <!-- 标题 -->
    <h1 class="page-title">
        Tarjeta de sellos
    </h1>

    <div class="page-subtitle">
        Paaani Rewards
    </div>


    <!-- 集章卡 -->
    <div class="stamp-card">

       <div class="stamp-card-header">

    <h2 class="stamp-card-title">
        Has conseguido
    </h2>

    <span class="stamp-count">
        0
    </span>

    <div class="stamp-card-text">
        sellos
    </div>

</div>

        <!-- 8个章 -->
        <div class="stamps">

            <img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">

<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">

        </div>


        <div class="stamp-progress">
            0 / 8 sellos
        </div>

    </div>


    <!-- 说明 -->
    <div class="reward-info">

        ☕ Consigue 1 sello con cada café participante.<br>

        🎁 Al completar 8 sellos,
        recibirás 1 café gratis.

    </div>

</div>

</body>
</html>
