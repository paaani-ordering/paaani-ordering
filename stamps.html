<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Paaani | Las Palmas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* 基础设置 */
   * {
       box-sizing: border-box;
   }

   body {
       margin: 0;
       font-family: 'Nunito', sans-serif;
       color: #59616c;
       background-image:
           linear-gradient(
               rgba(255,255,255,0.72),
               rgba(255,255,255,0.72)
           ),
           url("paaani-bg.png");
       background-repeat: repeat;
       background-size: 300px auto;
       min-height: 100vh;
   }

/* 手机页面 */
   .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 22px 20px 110px;
}

/* 返回按钮 */
   .back-button {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.8);
      color: #59616c;
      font-size: 22px;
      cursor: pointer;
      margin-bottom: 24px;
}
      
/* 标题 */
   .page-title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      color: #59616c;
}

   .page-subtitle {
      margin: 5px 0 24px;
      font-size: 14px;
      color: #999;
}

/* 集章卡 */
   .stamp-card {
      background: rgba(255,255,255,0.92);
      border-radius: 22px;
      padding: 22px 18px 24px;
      box-shadow: 0 6px 20px rgba(89,97,108,0.06);
}

/* 卡片顶部 */
   .stamp-card-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 22px;
}

/* 已获得 */
   .stamp-card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #59616c;
}

/* 数字 */
   .stamp-count {
      font-size: 20px;
      font-weight: 800;
      color: #F4B942;
}

/* 小说明 */
   .stamp-card-text {
      font-size: 14px;
      font-weight: 600;
      color: #59616c;
}
      
/* 8个印章 */
   .stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 16px;
      row-gap: 24px;
      margin-top: 6px;
      padding: 4px 2px 8px;
}

/* 单个杯子印章 */
   .stamp {
      width: 64px;
      height: 64px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      /* 未获得：淡灰色 */
      opacity: 0.15;
      filter:
          brightness(0)
          saturate(0);
      border: none;
      border-radius: 0;
      transition: 0.25s;
}

/* 已获得：变成 Paaani 蓝色 */
   .stamp.done {
      opacity: 1;
      filter:
          brightness(0)
          saturate(100%)
          invert(84%)
          sepia(18%)
          saturate(1098%)
          hue-rotate(169deg)
          brightness(101%)
          contrast(95%);
      transform: rotate(-4deg) scale(1.05);
}

/* 进度 */
   .stamp-progress {
      margin-top: 22px;
      font-size: 14px;
      font-weight: 700;
      color: #9a9a9a;
      text-align: center;
}
/* =========================
   集章 / 兑换记录 两个按钮区域
========================= */

.stamp-records {
    margin: 24px 20px 0;
    /* ⭐ 上 / 左右 / 下
       24px = 距离上面的集章卡
       32px = 页面左右距离
    */

    display: grid;

    grid-template-columns: 1fr 1fr;
    /* ⭐ 两个按钮一样宽 */

    gap: 10px;
    /* ⭐ 两个按钮之间的距离 */

    background: transparent;
    /* ⭐ 不需要外面的大白色卡片 */

    border-radius: 0;

    overflow: visible;
}


/* =========================
   单个按钮
========================= */

.record-item {
    height: 42px;
    /* ⭐ 按钮高度 */

    border: none;

    border-radius: 16px;
    /* ⭐ 按钮圆角 */

    background: #ffffff;
    /* ⭐ 按钮底色 */

    color: #59616c;
    /* ⭐ 文字颜色 */

    font-size: 14px;
    /* ⭐ 文字大小 */

    font-weight: 700;

    font-family: 'Nunito', sans-serif;

    display: flex;

    align-items: center;
    /* 文字上下居中 */

    justify-content: center;
    /* 文字左右居中 */

    gap: 5px;

    box-shadow: 0 4px 14px rgba(89, 97, 108, 0.08);
    /* ⭐ 阴影 */
}


/* 删除原来的中间竖线 */
.record-item:first-child {
    border-right: none;
}


/* =========================
   小图标
========================= */

.record-icon {
    font-size: 16px;
    /* ⭐ 图标大小 */

    color: #8ed8f8;
    /* ⭐ Paaani 蓝 */
}

</style>

</head>


<body>

<div class="app">

    <!-- 返回 -->
    <button
        class="back-button"
        onclick="history.back()">
        ←
    </button>


    <!-- 标题 -->
    <h1 class="page-title">
        Tarjeta de sellos
    </h1>

    <div class="page-subtitle">
        Paaani Rewards
    </div>


    <!-- 集章卡 -->
    <div class="stamp-card">

       <div class="stamp-card-header">

    <h2 class="stamp-card-title">
        Has conseguido
    </h2>

    <span class="stamp-count" id="stampCount">
    0
</span>

    <div class="stamp-card-text">
        sellos
    </div>

</div>

        <!-- 8个章 -->
        <div class="stamps">

            <img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">

<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">
<img class="stamp" src="stamp-cup.png" alt="">

        </div>


       <div class="stamp-progress" id="stampProgress">
    0 / 8 sellos
</div>

    </div>

<!-- =========================
     集章 / 兑换记录入口
========================= -->

<div class="stamp-records">

    <!-- 左边：集章记录 -->
    <button
        class="record-item"
        type="button"
        onclick="location.href='stamp-history.html'"
    >

        <!-- 集章记录小图标 -->
        <span class="record-icon">▣</span>

        <!-- 集章记录文字 -->
        <span>Historial de sellos</span>

    </button>


    <!-- 右边：兑换记录 -->
    <button
        class="record-item"
        type="button"
        onclick="location.href='redeem-history.html'"
    >

        <!-- 兑换记录小图标 -->
        <span class="record-icon">▣</span>

        <!-- 兑换记录文字 -->
        <span>Historial de canjes</span>

    </button>

</div>      

    <!-- 说明 -->
    <div class="reward-info">

        ☕ Consigue 1 sello con cada café participante.<br>

        🎁 Al completar 8 sellos,
        recibirás 1 café gratis.

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://oevwuadmtzujngtmkkbw.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


// ========================
// 读取当前用户集章
// ========================

async function loadStampCard() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError) {

    console.error(
      'Error al obtener el usuario:',
      userError
    );

    return;
  }


  // 没登录
  if (!user) {

    document
      .getElementById('stampCount')
      .textContent = '0';

    document
      .getElementById('stampProgress')
      .textContent = '0 / 8 sellos';

    return;
  }


  // ========================
  // 查询这个用户的集章卡
  // ========================

  const {
    data,
    error
  } = await supabaseClient
    .from('stamp_cards')
    .select('stamps')
    .eq('user_id', user.id)
    .maybeSingle();


  if (error) {

    console.error(
      'Error al cargar los sellos:',
      error
    );

    return;
  }


  const stampNumber =
    Math.min(
      Number(data?.stamps || 0),
      8
    );


  // ========================
  // 更新数字
  // ========================

  document
    .getElementById('stampCount')
    .textContent = stampNumber;


  document
    .getElementById('stampProgress')
    .textContent =
      `${stampNumber} / 8 sellos`;


  // ========================
  // 点亮对应数量的杯子
  // ========================

  const stampImages =
    document.querySelectorAll('.stamp');


  stampImages.forEach(
    (img, index) => {

      if (index < stampNumber) {

        img.classList.add('done');

      } else {

        img.classList.remove('done');

      }

    }
  );

}

// 页面打开时读取
loadStampCard(); 

</script>
      
</body>
</html>
