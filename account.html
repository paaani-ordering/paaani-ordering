<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi cuenta | Paaani</title>

  <style>
   
/* 手机主体 */
    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: transparent;
      padding-bottom: 30px;
}
    
/* 背景 */    
    body {
      width: 100%;
      max-width: 430px;
      font-family: Arial, sans-serif;
      margin: 0 auto;
      background-image:   
      linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
      url("paaani-bg.png");
      background-repeat: repeat;
      background-size: 300px auto;
      background-position: top left;
}
 
    /* 顶部 */
    .header {
      background: #8ed8f8;
      padding: 28px 22px 32px;
      color: white;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    /* 主体 */
    .content {
      padding: 25px 18px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 3px 14px rgba(0,0,0,.04);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 22px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }

    .field input:focus {
      border-color: #8ed8f8;
      background: white;
    }

    .main-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #8ed8f8;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .secondary-btn {
      width: 100%;
      height: 46px;
      border: 1px solid #8ed8f8;
      border-radius: 23px;
      background: white;
      color: #62bfe7;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      min-height: 20px;
    }

    /* 登录后的账户 */
    #account-view {
      display: none;
    }

    .welcome {
      text-align: center;
      padding: 10px 0 18px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #FFEAAB;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 30px;
    }

    .welcome h2 {
      margin: 0 0 7px;
    }

    .user-email {
      color: #777;
      font-size: 13px;
      word-break: break-all;
    }

    .account-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px 2px;
      border-top: 1px solid #eee;
      text-decoration: none;
      color: #222;
      font-size: 14px;
      font-weight: 600;
    }

    .logout-btn {
      width: 100%;
      height: 46px;
      margin-top: 20px;
      border-radius: 23px;
      border: 0;
      background: #f1f1f1;
      color: #555;
      font-weight: 700;
      cursor: pointer;
    }

   .bottom-space{

    height:78px;

}

/* 底部导航 */
    .bottom-nav {   /* 白色导航栏 */
       position: fixed;   /* 固定在底部 */
       left: 50%;
       bottom: 0;   /* 屏幕最下面 */
       transform: translateX(-50%);
       width: 100%;   /* 手机上占宽 */
       max-width: 480px;
       height: 72px;   /* 底部导航栏高度 */
       background: #ffffff;
       border-top: 1px solid #eeeeee;   /* 分割线 */
       display: flex;  /* 四个按钮横向排列 */
       justify-content: space-around;   /* 四个按钮平均分布 */
       align-items: center;   /* 四个按钮上下居中 */
       padding-bottom: env(safe-area-inset-bottom);
       z-index: 9999;   /* 让底部导航栏处于页面最上层 */
}
   .bottom-nav a,
   .bottom-nav .nav-item {
       text-decoration: none !important;
}

    .nav-item {   /* 每个按钮 */
       flex: 1;   /* 四个按钮平均分配宽度 */
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       gap: 4px;   /* 图标和文字距离 */
       color: #9a9a9a;   /* 没选中的颜色 */
       font-size: 11px;
       font-weight: 600;   /* 文字粗细 */
       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;   /* 字体 */
       -webkit-tap-highlight-color: transparent;    /* 手机点击链接时不出现浏览器默认方块 */
}

    .nav-icon {   /* 图标 */
       position: relative;
       display: flex;
       align-items: center;
       justify-content: center;
}

    .nav-icon svg {    
       width: 23px;   /* 图标大小 */
       height: 23px;   /* 图标大小 */
       fill: none;   /* 图标内不填充颜色 */
       stroke: currentColor;   /* 图标线条颜色跟随 */
       stroke-width: 1.8;   /* 图标线条粗细 */
       stroke-linecap: round;
       stroke-linejoin: round;
}

    .nav-item.active {   /* 当前页面 */
       color: #8ed8f8;
}

     body {   /* 防止页面内容被底栏挡住 */
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
}

  </style>
</head>

<body>

<div class="page">

  <header class="header">
    <h1>Mi cuenta</h1>
    <p>Tu espacio Paaani</p>
  </header>


  <main class="content">

    <!-- 未登录 -->
    <div class="card" id="login-view">

      <h2>Bienvenido</h2>

      <p class="description">
        Inicia sesión para guardar tus cupones y recompensas.
      </p>

      <div class="field">
        <label>Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="current-password"
        >
      </div>

      <button class="main-btn" id="login-btn">
        Iniciar sesión
      </button>

      <button class="secondary-btn" id="signup-btn">
        Crear una cuenta
      </button>

      <div class="message" id="message"></div>

    </div>


    <!-- 已登录 -->
    <div class="card" id="account-view">

      <div class="welcome">

        <div class="avatar">☕</div>

        <h2>¡Hola!</h2>

        <div class="user-email" id="user-email"></div>

      </div>

      <a href="coupons.html" class="account-link">
        <span>Mis cupones</span>
        <span>›</span>
      </a>

      <a href="orders.html" class="account-link">
        <span>Mis pedidos</span>
        <span>›</span>
      </a>

      <button class="logout-btn" id="logout-btn">
        Cerrar sesión
      </button>

    </div>

  </main>

</div>


<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a >

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a >

 <!-- 商城 -->
<a href="shop2.html" class="nav-item">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item active">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a >

</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ==============================
     把这里换成 menu.html 里的值
     ============================== */

  const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';

  const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  const loginView =
    document.getElementById('login-view');

  const accountView =
    document.getElementById('account-view');

  const emailInput =
    document.getElementById('email');

  const passwordInput =
    document.getElementById('password');

  const message =
    document.getElementById('message');

  const userEmail =
    document.getElementById('user-email');


  function showMessage(text, error = false) {

    message.textContent = text;

    message.style.color =
      error ? '#d9534f' : '#4f9f70';

  }


  function showLoggedIn(user) {

    loginView.style.display = 'none';

    accountView.style.display = 'block';

    userEmail.textContent =
      user.email || '';

  }


  function showLoggedOut() {

    loginView.style.display = 'block';

    accountView.style.display = 'none';

  }


  async function checkSession() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();

    if (session && session.user) {

      showLoggedIn(session.user);

    } else {

      showLoggedOut();

    }

  }


  document
    .getElementById('login-btn')
    .addEventListener('click', async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          'Introduce tu correo y contraseña.',
          true
        );

        return;
      }


      showMessage('Iniciando sesión...');


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;
      }


      showLoggedIn(data.user);

  });


  document
    .getElementById('signup-btn')
    .addEventListener('click', async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          'Introduce tu correo y contraseña.',
          true
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          'La contraseña debe tener al menos 6 caracteres.',
          true
        );

        return;
      }


      showMessage('Creando cuenta...');


      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password
        });


      if (error) {

        showMessage(
          error.message,
          true
        );

        return;
      }


     const user = data.user;

if (user) {

    const { data: member } = await supabaseClient
        .from("members")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();

    if (!member) {

        const { error: insertError } = await supabaseClient
  .from("members")
  .insert({
    id: user.id,
    name: "",
    email: user.email,
    points: 15,
    check_days: 0,
    last_checkin: null
  });

console.log(insertError);

if (insertError) {
  alert(insertError.message);
}
    }

}

if (data.session) {

    showLoggedIn(data.user);

} else {

    showMessage(
        'Cuenta creada. Revisa tu correo para confirmar tu cuenta.'
    );

}
  });


  document
    .getElementById('logout-btn')
    .addEventListener('click', async () => {

      await supabaseClient.auth.signOut();

      showLoggedOut();

  });


  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session && session.user) {

        showLoggedIn(session.user);

      } else {

        showLoggedOut();

      }

    }
  );


  checkSession();

</script>

</body>
</html>
