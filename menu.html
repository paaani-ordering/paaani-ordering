<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paaani Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f5;
      color: #222;
    }

    header {
      background: #8ed8f8;
      padding: 28px 20px;
      text-align: center;
    }

    .header-logo {
  width: 120px;
  height: auto;
  display: block;
  margin: 0 auto 8px;
}

    header p {
  margin: 10px 0 0;
  font-size: 20px;
  color: white;
  font-weight: 500;
}

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 18px 15px;
    }

    .categories button {
  border: none;
  background: white;
  color: #8ed8f8;
  padding: 11px 18px;
  border-radius: 25px;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.categories button.active {
  background: #8ed8f8;
  color: white;
}

    .menu {
      padding: 0 15px 100px;
      max-width: 600px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 14px;
    }

    .info {
      flex: 1;
    }

    .info h3 {
      margin: 0 0 7px;
    }

    .description {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
    }

    .add {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFEAAB;
      font-size: 24px;
      cursor: pointer;
    }

    .cart {
      position: fixed;
      bottom: calc(84px + env(safe-area-inset-bottom));
      left: 15px;
      right: 15px;
      max-width: 570px;
      margin: auto;
      background: #8ed8f8;
      color: white;
      padding: 16px 20px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
    }
    /* ===== 底部导航栏 ===== */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  text-decoration: none;

  color: #8C8C88;

  font-size: 11px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item.active {
  color: #8ed8f8;
  font-weight: bold;
}

.nav-dot {
  position: absolute;

  width: 7px;
  height: 7px;

  right: -2px;
  top: -1px;

  background: #FFEAAB;
  border: 2px solid #ffffff;
  border-radius: 50%;
}
  </style>
</head>

<body>

<header>
  <img class="header-logo" src="https://oevwuadmtzujngtmkkbw.supabase.co/storage/v1/object/public/product-images/logo-bai.png" alt="Paaani">
  <p>¿Qué te apetece hoy?</p >
</header>

<div class="categories">

  <button class="active" data-category="a6fca325-d92c-4475-9254-7a9e512cb240">
  Cafés especiales
</button>

  <button data-category="518f932f-6a26-4b33-9dc4-002225e208f6">
    Cafés
  </button>

  <button data-category="9268fdce-f27b-45dc-bc89-e7ef7c13c6dc">
    Bebidas
  </button>

  <button data-category="ade5d730-ee05-478d-9406-54427f06956d">
    Desayunos
  </button>

  <button data-category="7fb4cb63-be76-477c-8204-7d3a9cb851d8">
    Postres
  </button>

  <button data-category="5684d15f-811c-4124-9e91-f5843d5ef2b8">
    Ensaladas
  </button>

  <button data-category="3ccae3bb-3595-4b78-b5f9-a5c5c108c747">
    Merchandising
  </button>
</div>

<div class="menu">

</div>

<div class="cart">
  <span>🛒 Mi pedido</span>
  <span>0 productos</span>
</div>

<script>
const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

let cart = {};
let allProducts = [];
let allOptions = [];

// 默认打开 Café especiales
const defaultCategory = 'a6fca325-d92c-4475-9254-7a9e512cb240';

// 价格格式
function formatPrice(price) {
  return `${Number(price).toFixed(2).replace('.', ',')} €`;
}

// =========================
// 读取商品 + 商品选项
// =========================
async function loadProducts() {
  try {

    const [productsResponse, optionsResponse] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      ),

      fetch(
        `${SUPABASE_URL}/rest/v1/product_options?select=*&is_available=eq.true&order=sort_order.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      )
    ]);

    if (!productsResponse.ok) {
      throw new Error(`Products Error ${productsResponse.status}`);
    }

    if (!optionsResponse.ok) {
      throw new Error(`Options Error ${optionsResponse.status}`);
    }

    allProducts = await productsResponse.json();
    allOptions = await optionsResponse.json();

    console.log('Productos:', allProducts);
    console.log('Opciones:', allOptions);

    // 默认只显示 Café especiales
    const defaultProducts = allProducts
  .filter(product => product.category_id === defaultCategory)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)); 

    renderProducts(defaultProducts);

  } catch (error) {

    console.error('Error al cargar datos:', error);

    document.querySelector('.menu').innerHTML = `
      <p>No se pudieron cargar los productos.</p >
    `;
  }
}


// =========================
// 显示商品
// =========================
function renderProducts(products) {

  const menu = document.querySelector('.menu');

  menu.innerHTML = '';

  products.forEach(product => {

    const item = document.createElement('div');

    item.className = 'product';

    item.innerHTML = `
      ${
        product.image_url
          ? `<img src="${product.image_url}" alt="${product.name}">`
          : ''
      }

      <div class="info">

        <h3>${product.name}</h3>

        <div class="description">
          ${product.description || ''}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

      </div>

      <button class="add" type="button">+</button>
    `;

    item.querySelector('.add').addEventListener('click', () => {
      handleAddProduct(product);
    });

    menu.appendChild(item);
  });
}


// =========================
// 点击商品 +
// =========================
function handleAddProduct(product) {

  const options = allOptions.filter(option =>
    option.product_id === product.id &&
    option.is_available !== false
  );

  // 没有大小选项 → 直接加入
  if (options.length === 0) {
    addToCart(product, null);
    return;
  }

  // 有选项 → 打开选择窗口
  openOptionModal(product, options);
}


// =========================
// 打开大小选择窗口
// =========================
function openOptionModal(product, options) {

  const oldModal = document.getElementById('optionOverlay');

  if (oldModal) {
    oldModal.remove();
  }

  const groupName =
    options[0]?.group_name || 'Tamaño';

  const overlay = document.createElement('div');

  overlay.id = 'optionOverlay';

  overlay.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:2000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  `;

  overlay.innerHTML = `

    <div style="
      background:white;
      width:100%;
      max-width:600px;
      border-radius:24px 24px 0 0;
      padding:24px 20px 30px;
    ">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:8px;
      ">

        <h2 style="
          margin:0;
          font-size:24px;
        ">
          ${product.name}
        </h2>

        <button
          id="closeOptionModal"
          type="button"
          style="
            border:none;
            background:none;
            font-size:30px;
            cursor:pointer;
          "
        >
          ×
        </button>

      </div>

      <div style="
        font-size:16px;
        font-weight:bold;
        margin:20px 0 12px;
      ">
        ${groupName}
      </div>

      <div id="optionButtons"></div>

    </div>
  `;

  document.body.appendChild(overlay);

  const buttonsContainer =
    document.getElementById('optionButtons');

  options.forEach(option => {

    const finalPrice =
      Number(product.price) +
      Number(option.price_delta || 0);

    const button =
      document.createElement('button');

    button.type = 'button';

    button.style.cssText = `
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 18px;
      margin-bottom:10px;
      border:2px solid #8ed8f8;
      border-radius:16px;
      background:white;
      color:#222;
      font-size:17px;
      cursor:pointer;
    `;

    button.innerHTML = `
      <strong>${option.option_name}</strong>

      <span>
        ${formatPrice(finalPrice)}
      </span>
    `;

    button.addEventListener('click', () => {

      addToCart(product, option);

      overlay.remove();
    });

    buttonsContainer.appendChild(button);
  });

  document
    .getElementById('closeOptionModal')
    .addEventListener('click', () => {
      overlay.remove();
    });

  // 点黑色背景关闭
  overlay.addEventListener('click', event => {

    if (event.target === overlay) {
      overlay.remove();
    }
  });
}


// =========================
// 分类按钮
// =========================
document.querySelectorAll('.categories button').forEach(button => {

  button.addEventListener('click', () => {

    document.querySelectorAll('.categories button').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    const category =
      button.dataset.category;

    if (category === 'all') {
      renderProducts(allProducts);
      return;
    }

    const filteredProducts = allProducts
  .filter(product => product.category_id === category)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

renderProducts(filteredProducts);
  });
});


// =========================
// 加入购物车
// =========================
function addToCart(product, option) {

  const optionId =
    option ? option.id : 'normal';

  // 同一个商品不同大小分开
  const cartKey =
    `${product.id}_${optionId}`;

  const priceDelta =
    option
      ? Number(option.price_delta || 0)
      : 0;

  const finalPrice =
    Number(product.price) + priceDelta;

  if (cart[cartKey]) {

    cart[cartKey].quantity += 1;

  } else {

    cart[cartKey] = {

      ...product,

      cartKey: cartKey,

      optionId:
        option ? option.id : null,

      optionName:
        option ? option.option_name : null,

      groupName:
        option ? option.group_name : null,

      basePrice:
        Number(product.price),

      price:
        finalPrice,

      quantity: 1
    };
  }

  updateCartBar();
}


// =========================
// 修改数量
// =========================
function changeQuantity(cartKey, amount) {

  if (!cart[cartKey]) return;

  cart[cartKey].quantity += amount;

  if (cart[cartKey].quantity <= 0) {
    delete cart[cartKey];
  }

  updateCartBar();
  renderCart();
}


// =========================
// 商品总数量
// =========================
function getCartCount() {

  return Object.values(cart).reduce(
    (total, product) =>
      total + product.quantity,
    0
  );
}


// =========================
// 总价
// =========================
function getCartTotal() {

  return Object.values(cart).reduce(
    (total, product) =>
      total +
      Number(product.price) *
      product.quantity,
    0
  );
}


// =========================
// 更新底部购物车
// =========================
function updateCartBar() {

  const count =
    getCartCount();

  const cartText =
    document.querySelector('.cart span:last-child');

  cartText.textContent =
    `${count} ${
      count === 1
        ? 'producto'
        : 'productos'
    } · ${formatPrice(getCartTotal())}`;
}


// =========================
// 打开购物车
// =========================
function openCart() {

  renderCart();

  document
    .getElementById('cartOverlay')
    .style.display = 'flex';
}


// =========================
// 关闭购物车
// =========================
function closeCart() {

  document
    .getElementById('cartOverlay')
    .style.display = 'none';
}


// =========================
// 显示购物车
// =========================
function renderCart() {

  const cartItems =
    document.getElementById('cartItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {

    cartItems.innerHTML = `

      <p style="
        text-align:center;
        color:#777;
        padding:30px 0;
      ">
        Tu pedido está vacío
      </p >
    `;

  } else {

    cartItems.innerHTML =
      products.map(product => `

        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          padding:14px 0;
          border-bottom:1px solid #eee;
        ">

          ${
            product.image_url
              ? `
                <img
                  src="${product.image_url}"
                  alt="${product.name}"
                  style="
                    width:60px;
                    height:60px;
                    object-fit:cover;
                    border-radius:12px;
                  "
                >
              `
              : ''
          }

          <div style="flex:1;">

            <strong>
              ${product.name}
            </strong>

            ${
              product.optionName
                ? `
                  <div style="
                    margin-top:4px;
                    font-size:14px;
                    color:#777;
                  ">
                    ${product.optionName}
                  </div>
                `
                : ''
            }

            <div style="margin-top:5px;">
              ${formatPrice(product.price)}
            </div>

          </div>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', -1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              font-size:20px;
              cursor:pointer;
            "
          >
            −
          </button>

          <strong>
            ${product.quantity}
          </strong>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', 1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              background:#FFEAAB;
              font-size:20px;
              cursor:pointer;
            "
          >
            +
          </button>

        </div>

      `).join('');
  }

  document
    .getElementById('cartTotal')
    .textContent =
      formatPrice(getCartTotal());
}


// =========================
// 点击底部购物车
// =========================
document
  .querySelector('.cart')
  .addEventListener('click', openCart);


// =========================
// 创建购物车弹窗
// =========================
document.body.insertAdjacentHTML(
  'beforeend',
  `

  <div
    id="cartOverlay"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:999;
      align-items:flex-end;
      justify-content:center;
    "
  >

    <div
      style="
        background:white;
        width:100%;
        max-width:600px;
        max-height:85vh;
        overflow:auto;
        border-radius:24px 24px 0 0;
        padding:20px;
      "
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;
      ">

        <h2 style="margin:0;">
          Mi pedido
        </h2>

        <button
          type="button"
          onclick="closeCart()"
          style="
            border:none;
            background:none;
            font-size:28px;
            cursor:pointer;
          "
        >
          ×
        </button>

      </div>

      <div id="cartItems"></div>

      <div style="
        display:flex;
        justify-content:space-between;
        font-size:20px;
        font-weight:bold;
        padding-top:20px;
      ">

        <span>Total</span>

        <span id="cartTotal">
          0,00 €
        </span>

      </div>

      <button
        id="checkoutButton"
        type="button"
        style="
          display:block;
          width:100%;
          margin-top:20px;
          padding:17px;
          border:none;
          border-radius:16px;
          background:#FFEAAB;
          color:#222;
          font-size:17px;
          font-weight:bold;
          cursor:pointer;
        "
      >
        Confirmar pedido
      </button>

    </div>

  </div>
  `
);


// =========================
// 开始加载
// =========================
loadProducts();

</script>
  <!-- 底部导航栏 -->
<nav class="bottom-nav">

  <a href=" " class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M3 10.5L12 3l9 7.5v9H15v-6H9v6H3z"/>
    </svg>
    <span>Inicio</span>
  </a >

  <a href="menu.html" class="nav-item active">
    <svg viewBox="0 0 24 24">
      <path d="M5 6h14M5 12h14M5 18h14"/>
    </svg>
    <span>Menú</span>
  </a >

  <a href="orders.html" class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>
      <path d="M9 8h6M9 12h6"/>
    </svg>
    <span>Pedidos</span>
  </a >

  <a href="account.html" class="nav-item">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
    </svg>
    <span>Mi cuenta</span>
  </a >

</nav>
</body>
</html>
