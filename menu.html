<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paaani Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f5;
      color: #222;
    }

    /* ===== 菜单顶部店铺信息 ===== */

header {
  background: #ffffff;
  padding: 16px 16px 12px;
  text-align: left;
}

/* 最上面的品牌名 */
.shop-title {
  text-align: center;
  padding: 18px 0 22px;
}

.shop-title-logo {
  width: 160px;
  height: auto;
  display: block;
  margin: 0 auto;
  transform: translateY(-15px);
}

/* 店铺名称 + 用餐方式 */
.shop-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.shop-name {
  font-size: 17px;
  font-weight: 700;
  color: #222;
  white-space: nowrap;
}

/* 堂食 / 外带 */
.order-types {
  display: flex;
  background: #f5f5f5;
  border-radius: 22px;
  padding: 3px;
}

.order-type {
  border: 0;
  background: transparent;
  color: #999;
  padding: 8px 12px;
  border-radius: 19px;
  font-size: 12px;
  white-space: nowrap;
}

.order-type.active {
  background: #8ed8f8;
  color: #ffffff;
  font-weight: 700;
}

/* 店铺副信息 */
.shop-sub {
  margin-top: 5px;
  font-size: 12px;
  color: #999;
}

/* 提示信息 */
.shop-notice {
  margin-top: 13px;
  padding-top: 10px;
  border-top: 1px solid #eeeeee;

  font-size: 11px;
  line-height: 1.4;
  color: #888;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== 左侧分类 + 右侧商品 ===== */

.menu-layout {
  display: flex;
  align-items: flex-start;
  width: 100%;
}

/* 左侧分类栏 */
.categories {
  width: 85px;
  flex: 0 0 85px;

  display: flex;
  flex-direction: column;
  gap: 0;

  padding: 0;
  background: #f5f5f3;

  position: sticky;
  top: 0;

  max-height: calc(100vh - 160px);
  overflow-y: auto;
  overflow-x: hidden;
}

/* 分类按钮 */
.categories button {
  width: 100%;
  min-height: 64px;

  border: none;
  border-radius: 0;

  background: transparent;
  color: #777;

  padding: 10px 5px;

  white-space: normal;
  text-align: center;

  font-size: 10px;
  font-weight: 600;
  line-height: 1.2;

  cursor: pointer;
}

/* 当前分类 */
.categories button.active {
  background: #ffffff;
  color: #8ed8f8;
  font-weight: 700;
}

/* 右侧商品区域 */
.menu {
  flex: 1;
  min-width: 0;

  padding: 12px 10px 130px;

  margin: 0;
  max-width: none;
}

    .product {
      background: white;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 14px;
    }

    .info {
      flex: 1;
    }

    /* 产品名字 */
.info h3 {
  margin: 0 0 5px;
  font-size: 13px;      /* 名字大小 */
  line-height: 1.2;
  font-weight: 700;
}

/* 产品说明 */
.description {
  font-size: 8px;      /* 说明大小 */
  line-height: 1.2;
  color: #777;
  margin-bottom: 7px;
}

/* 价格 */
.price {
  font-weight: 700;
  font-size: 12px;      /* 价格大小 */
}

    .add {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFEAAB;
      font-size: 16px;
      cursor: pointer;
    }

    .cart {
      position: fixed;
      bottom: calc(70px + env(safe-area-inset-bottom));
      left: 15px;
      right: 15px;
      max-width: 570px;
      margin: auto;
      background: #8ed8f8;
      color: white;
      padding: 16px 20px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
    }
   .bottom-space{

    height:78px;

}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}
  </style>
</head>

<body>

<header>

  <div class="shop-title">
  <img src="paaani-logo.png" class="shop-title-logo" alt="Paaani Café">
</div>

  <div class="shop-main">

    <div>
      <div class="shop-name">☆ Paaani</div>
    </div>

    <div class="order-types">
  <button class="order-type active" data-type="dinein">
    Comer aquí
  </button>

  <button class="order-type" data-type="takeaway">
    Para llevar
  </button>
</div>
  </div>

  <div class="shop-notice">
    ☀︎ Productos preparados al momento · Disfrútalos recién hechos
  </div>

</header>
<div class="menu-layout">
<div class="categories">

  <button class="active" data-category="a6fca325-d92c-4475-9254-7a9e512cb240">
  Cafés especiales
</button>

  <button data-category="518f932f-6a26-4b33-9dc4-002225e208f6">
    Cafés
  </button>

  <button data-category="9268fdce-f27b-45dc-bc89-e7ef7c13c6dc">
    Bebidas
  </button>

  <button data-category="ade5d730-ee05-478d-9406-54427f06956d">
    Desayunos
  </button>

  <button data-category="7fb4cb63-be76-477c-8204-7d3a9cb851d8">
    Postres
  </button>

  <button data-category="5684d15f-811c-4124-9e91-f5843d5ef2b8">
    Platos
  </button>

</div>

<div class="menu">

</div>
</div>
<div class="cart">
  <span>🛒 Mi pedido</span>
  <span>0 productos</span>
</div>

<script>
const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

// 从浏览器读取购物车
// 读取当前进入菜单的方式
const initialParams = new URLSearchParams(window.location.search);
const initialType = initialParams.get('type');

// 从主页进入外带菜单：先清空旧购物车，再读取购物车
if (initialType === 'takeaway') {
    localStorage.removeItem('paaaani_cart');
    sessionStorage.removeItem('paaaani_cart');

    // 顺便清除之前写错名字留下的旧购物车
    localStorage.removeItem('paaaaani_cart');
    sessionStorage.removeItem('paaaaani_cart');
}

let cart = JSON.parse(localStorage.getItem('paaaani_cart') || '{}');
let allProducts = [];
let allOptions = [];

// 读取之前选择的用餐方式
let selectedOrderType =
    new URLSearchParams(window.location.search).get('type') ||
    localStorage.getItem('paaaani_order_type') ||
    'dinein';

localStorage.setItem('paaaani_order_type', selectedOrderType);

// 默认打开 Café especiales
const defaultCategory = 'a6fca325-d92c-4475-9254-7a9e512cb240';

// 价格格式
function formatPrice(price) {
  return `${Number(price).toFixed(2).replace('.', ',')} €`;
}
const params = new URLSearchParams(window.location.search);
const urlType = params.get('type');

if (urlType === 'dinein' || urlType === 'takeaway') {
  localStorage.setItem('paaani_order_type', urlType);
}

if (!localStorage.getItem('paaani_order_type')) {
  localStorage.setItem('paaani_order_type', 'dinein');
}
// =========================
// 读取商品 + 商品选项
// =========================
async function loadProducts() {
  try {

    const [productsResponse, optionsResponse] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      ),

      fetch(
        `${SUPABASE_URL}/rest/v1/product_options?select=*&is_available=eq.true&order=sort_order.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      )
    ]);

    if (!productsResponse.ok) {
      throw new Error(`Products Error ${productsResponse.status}`);
    }


    allProducts = await productsResponse.json();
   allOptions = optionsResponse.ok ? await optionsResponse.json() : [];
    console.log('Productos:', allProducts);
    console.log('Opciones:', allOptions);

    // 默认只显示 Café especiales
    const defaultProducts = allProducts
  .filter(product => product.category_id === defaultCategory)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)); 

    renderProducts(defaultProducts.length > 0 ? defaultProducts : allProducts);

  } catch (error) {

    console.error('Error al cargar datos:', error);

    document.querySelector('.menu').innerHTML = `
      <p>No se pudieron cargar los productos.</p >
    `;
  }
}


// =========================
// 显示商品
// =========================
function renderProducts(products) {

  const menu = document.querySelector('.menu');

  menu.innerHTML = '';

  products.forEach(product => {

    const item = document.createElement('div');

    item.className = 'product';

    item.innerHTML = `
      ${
        product.image_url
          ? `<img src="${product.image_url}" alt="${product.name}">`
          : ''
      }

      <div class="info">

        <h3>${product.name}</h3>

        <div class="description">
          ${product.description || ''}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

      </div>

     <button class="add" type="button" data-product-id="${product.id}">+</button>
    `;

    item.querySelector('.add').addEventListener('click', () => {
      handleAddProduct(product);
    });

    menu.appendChild(item);
  });
}


// =========================
// 点击商品 +
// =========================
  function updateProductButtons() {
    document.querySelectorAll('.add[data-product-id]').forEach(button => {
        const productId = button.dataset.productId;

        const quantity = Object.values(cart)
            .filter(item => String(item.id) === String(productId))
            .reduce((total, item) => total + Number(item.quantity || 0), 0);

        button.textContent = quantity > 0 ? quantity : '+';
    });
}
function handleAddProduct(product) {

  const options = allOptions.filter(option =>
    option.product_id === product.id &&
    option.is_available !== false
  );

  // 没有大小选项 → 直接加入
  if (options.length === 0) {
    addToCart(product, null);
    return;
  }

  // 有选项 → 打开选择窗口
  openOptionModal(product, options);
}

function openOptionModal(product, options) {

    const oldModal = document.getElementById('optionOverlay');

    if (oldModal) {
        oldModal.remove();
    }

    const groupName = options[0]?.group_name || 'Tamaño';

    const overlay = document.createElement('div');

    overlay.id = 'optionOverlay';

    overlay.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:2000;
        display:flex;
        align-items:flex-end;
        justify-content:center;
    `;

    overlay.innerHTML = `
        <div style="
            background:white;
            width:100%;
            max-width:600px;
            border-radius:24px 24px 0 0;
            padding:24px 20px 30px;
            margin-bottom:72px;
            max-height:calc(100vh - 72px);
            overflow-y:auto;
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:18px;
            ">

                <h2 style="
                    margin:0;
                    font-size:24px;
                ">
                    ${product.name}
                </h2>

                <button
                    id="closeOptionModal"
                    type="button"
                    style="
                        border:none;
                        background:none;
                        font-size:30px;
                        cursor:pointer;
                        color:#1688E8;
                    "
                >
                    ×
                </button>

            </div>

            <h3 style="
                margin:0 0 14px;
                font-size:18px;
            ">
                ${groupName}
            </h3>

            <div id="optionButtons"></div>

        </div>
    `;

    document.body.appendChild(overlay);

    const buttonsContainer =
        document.getElementById('optionButtons');


    /* =========================
       EXTRAS → 多选
    ========================= */

    if (groupName.toLowerCase() === 'extras') {

        let selectedOptions = [];

        const renderExtras = () => {

            const totalExtra = selectedOptions.reduce(
                (sum, option) =>
                    sum + Number(option.price_delta || 0),
                0
            );

            buttonsContainer.innerHTML = '';

            options.forEach(option => {

                const selected =
                    selectedOptions.some(
                        item => item.id === option.id
                    );

                const row =
                    document.createElement('button');

                row.type = 'button';

                row.style.cssText = `
                    width:100%;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:16px 18px;
                    margin-bottom:10px;
                    border:2px solid ${selected ? '#8ED8F8' : '#E5E5E5'};
                    border-radius:16px;
                    background:${selected ? '#F4FCFF' : '#fff'};
                    color:#222;
                    font-size:17px;
                    font-weight:700;
                    cursor:pointer;
                `;

                row.innerHTML = `
                    <span style="
                        display:flex;
                        align-items:center;
                        gap:12px;
                    ">

                        <span style="
                            width:22px;
                            height:22px;
                            border:2px solid #8ED8F8;
                            border-radius:6px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#8ED8F8;
                            font-size:16px;
                        ">
                            ${selected ? '✓' : ''}
                        </span>

                        ${option.option_name}

                    </span>

                    <span>
                        +${formatPrice(Number(option.price_delta || 0))}
                    </span>
                `;

                row.addEventListener('click', () => {

                    if (selected) {

                        selectedOptions =
                            selectedOptions.filter(
                                item => item.id !== option.id
                            );

                    } else {

                        selectedOptions.push(option);

                    }

                    renderExtras();
                });

                buttonsContainer.appendChild(row);
            });


            /* 总价 + 加入购物车 */

            const totalBox =
                document.createElement('div');

            totalBox.style.cssText = `
                margin-top:16px;
            `;

            totalBox.innerHTML = `

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:12px;
                    font-size:18px;
                    font-weight:800;
                ">
                    <span>Total</span>

                    <span>
                        ${formatPrice(
                            Number(product.price) + totalExtra
                        )}
                    </span>
                </div>

                <button
                    id="confirmExtras"
                    type="button"
                    style="
                        width:100%;
                        height:50px;
                        border:none;
                        border-radius:16px;
                        background:#8ED8F8;
                        color:white;
                        font-size:17px;
                        font-weight:800;
                        cursor:pointer;
                    "
                >
                    Añadir al pedido
                </button>
            `;

            buttonsContainer.appendChild(totalBox);


            document
                .getElementById('confirmExtras')
                .addEventListener('click', () => {

                    if (selectedOptions.length === 0) {

                        addToCart(product, null);

                    } else {

                        const combinedOption = {

                            id:
                                'extras_' +
                                selectedOptions
                                    .map(option => option.id)
                                    .join('_'),

                            option_name:
                                selectedOptions
                                    .map(option => option.option_name)
                                    .join(' + '),

                            group_name: 'Extras',

                            price_delta:
                                totalExtra

                        };

                        addToCart(
                            product,
                            combinedOption
                        );
                    }

                    overlay.remove();
                });
        };

        renderExtras();

    } else {


        /* =========================
           其他选项 → 保持单选
        ========================= */

        options.forEach(option => {

            const finalPrice =
                Number(product.price) +
                Number(option.price_delta || 0);

            const button =
                document.createElement('button');

            button.type = 'button';

            button.style.cssText = `
                width:100%;
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:16px 18px;
                margin-bottom:10px;
                border:2px solid #8ED8F8;
                border-radius:16px;
                background:white;
                color:#222;
                font-size:17px;
                font-weight:700;
                cursor:pointer;
            `;

            button.innerHTML = `
                <strong>
                    ${option.option_name}
                </strong>

                <span>
                    ${formatPrice(finalPrice)}
                </span>
            `;

            button.addEventListener('click', () => {

                addToCart(product, option);

                overlay.remove();

            });

            buttonsContainer.appendChild(button);
        });
    }


    document
        .getElementById('closeOptionModal')
        .addEventListener('click', () => {
            overlay.remove();
        });


    overlay.addEventListener('click', event => {

        if (event.target === overlay) {
            overlay.remove();
        }

    });
}
  
// =========================
// 分类按钮
// =========================
document.querySelectorAll('.categories button').forEach(button => {

  button.addEventListener('click', () => {

    document.querySelectorAll('.categories button').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    const category =
      button.dataset.category;

    if (category === 'all') {
      renderProducts(allProducts);
      return;
    }

    const filteredProducts = allProducts
  .filter(product => product.category_id === category)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

renderProducts(filteredProducts);
  });
});


// =========================
// 加入购物车
// =========================
function addToCart(product, option) {

  const optionId =
    option ? option.id : 'normal';

  // 同一个商品不同大小分开
  const cartKey =
    `${product.id}_${optionId}`;

  const priceDelta =
    option
      ? Number(option.price_delta || 0)
      : 0;

  const finalPrice =
    Number(product.price) + priceDelta;

  if (cart[cartKey]) {

    cart[cartKey].quantity += 1;

  } else {

    cart[cartKey] = {

      ...product,

      cartKey: cartKey,

      optionId:
        option ? option.id : null,

      optionName:
        option ? option.option_name : null,

      groupName:
        option ? option.group_name : null,

      basePrice:
        Number(product.price),

      price:
        finalPrice,

      quantity: 1
    };
  }

  updateCartBar();
updateProductButtons();
}


// =========================
// 修改数量
// =========================
function changeQuantity(cartKey, amount) {

  if (!cart[cartKey]) return;

  cart[cartKey].quantity += amount;

  if (cart[cartKey].quantity <= 0) {
    delete cart[cartKey];
  }

  updateCartBar();
renderCart();
updateProductButtons();
}


// =========================
// 商品总数量
// =========================
function getCartCount() {

  return Object.values(cart).reduce(
    (total, product) =>
      total + product.quantity,
    0
  );
}


// =========================
// 总价
// =========================
function getCartTotal() {

  return Object.values(cart).reduce(
    (total, product) =>
      total +
      Number(product.price) *
      product.quantity,
    0
  );
}


// =========================
// 更新底部购物车
// =========================
function updateCartBar() {

  // 保存购物车，跳到 checkout.html 后还能读取
  localStorage.setItem('paaani_cart', JSON.stringify(cart));

  const count = getCartCount();

  const cartText =
    document.querySelector('.cart span:last-child');

  cartText.textContent =
    `${count} ${
      count === 1
        ? 'producto'
        : 'productos'
    } · ${formatPrice(getCartTotal())}`;
}

// =========================
// 打开购物车
// =========================
function openCart() {

  renderCart();

  document
    .getElementById('cartOverlay')
    .style.display = 'flex';
}


// =========================
// 关闭购物车
// =========================
function closeCart() {

  document
    .getElementById('cartOverlay')
    .style.display = 'none';
}


// =========================
// 显示购物车
// =========================
function renderCart() {

  const cartItems =
    document.getElementById('cartItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {

    cartItems.innerHTML = `

      <p style="
        text-align:center;
        color:#777;
        padding:30px 0;
      ">
        Tu pedido está vacío
      </p >
    `;

  } else {

    cartItems.innerHTML =
      products.map(product => `

        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          padding:14px 0;
          border-bottom:1px solid #eee;
        ">

          ${
            product.image_url
              ? `
                <img
                  src="${product.image_url}"
                  alt="${product.name}"
                  style="
                    width:60px;
                    height:60px;
                    object-fit:cover;
                    border-radius:12px;
                  "
                >
              `
              : ''
          }

          <div style="flex:1;">

            <strong>
              ${product.name}
            </strong>

            ${
              product.optionName
                ? `
                  <div style="
                    margin-top:4px;
                    font-size:14px;
                    color:#777;
                  ">
                    ${product.optionName}
                  </div>
                `
                : ''
            }

            <div style="margin-top:5px;">
              ${formatPrice(product.price)}
            </div>

            +
          </button>

        </div>

      `).join('');
  }
