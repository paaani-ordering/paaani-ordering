<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paaani | Las Palmas</title>

  <style>
    * {
      box-sizing: border-box;
    }
    
/* 手机主体 */
    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: transparent;
      padding-bottom: 30px;
}
    
/* 背景 */    
    body {
      width: 100%;
      max-width: 430px;
      font-family: Arial, sans-serif;
      margin: 0 auto;
      background-image:   
      linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
      url("paaani-bg.png");
      background-repeat: repeat;
      background-size: 300px auto;
      background-position: top left;
}
    
/* 最上面的 Logo 区域 */
   .shop-title {
     text-align: center;
     padding: 32px 0 28px;
}
    
/* logo */
   .shop-title-logo {
     width: 160px;   /* 宽度 */
     height: auto;
     display: block;
     margin: 0 auto;   /* 水平居中 */
     transform: none;  
}

/* 店铺名称 + 用餐方式 */
   .shop-main {
     display: flex;   /* 横向布局 */
     align-items: center;   /* 左边店名与右边按钮上下居中对齐 */
     justify-content: space-between;
     gap: 10px;
     padding:0 16px;
}

   .shop-name {   /* 店铺名称 */
     font-size: 17px;
     font-weight: 700;
     color: #222;
     white-space: nowrap;
}

/* 用餐方式按钮 */
   .order-types {
     display: flex;   /* 横向布局 */
     background: #f5f5f5;
     border-radius: 22px;   /* 圆角 */
     padding: 3px;   /* 灰色底座与两个按钮之间距离 */
}

   .order-type {   /* 同时控制两个按钮 */
     border: 0;   /* 去掉边框 */
     background: transparent;   
     color: #999;   /* 没选中的 */
     padding: 8px 12px;   /* 按钮大小 上下 左右 */
     border-radius: 19px;   /* 圆角 */
     font-size: 12px;
     white-space: nowrap;
}

   .order-type.active {   /* 控制被选中按钮 */
     background: #8ed8f8;
     color: #ffffff;
     font-weight: 700;
}

/* 小字 */
   .shop-notice {
     padding-left:16px;
     padding-right:16px;
     margin-top: 13px;
     padding-top: 10px;
     border-top: 1px solid #eeeeee;   /* 分割横线 */
     font-size: 11px;
     line-height: 1.4;
     color: #888;
     white-space: nowrap;
     overflow: hidden;
     text-overflow: ellipsis;
}

/* 左侧分类 + 右侧商品 */
   .menu-layout {
     display: flex;   /* 横向排列 */
     align-items: flex-start;   /* 顶部对齐 */
     width: 100%;
}

/* 左侧分类栏 */
  .categories {
     width: 85px;   /* 分类栏宽度 */
     flex: 0 0 85px;   /* 分类栏宽度 */
     display: flex;
     flex-direction: column;   /* 竖着排列 */
     gap: 0;
     padding: 0;
     background: transparent;
     position: sticky;
     top: 0;
     max-height: calc(100vh - 160px);   /* 分类栏最大高度 */
     overflow-y: auto;
     overflow-x: hidden;
}

/* 分类按钮 */
  .categories button {
     width: 100%;
     min-height: 64px;   /* 按钮高度 */
     border: none;   /* 取消边框 */
     border-radius: 0;   /* 圆角 */
     background: transparent;
     color: #777;
     padding: 10px 5px;   /* 按钮内部留白 */
     white-space: normal;
     text-align: center;
     font-size: 10px;
     font-weight: 600;
     line-height: 1.2;
     cursor: pointer;
}

/* 当前分类 */
  .categories button.active {
     background: #ffffff;
     color: #8ed8f8;
     font-weight: 700;
}

/* 商品区域 */
  .menu {
     flex: 1;
     min-width: 0;
     padding: 12px 10px 130px;   /* 内部留白 */
     margin: 0;
     max-width: none;
}

/* 商品卡片 */
  .product {
     background: white;
     border-radius: 16px;
     padding: 10px;   /* 卡片四周内部留 */
     margin-bottom: 12px;   /* 卡片间距 */
     display: flex;
     align-items: center;
     gap: 11px;   /* 图片文字距离 */
}

/* 商品图片 */
  .product img {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 12px;
}

/* 商品信息 */
  .info {
    flex: 1;
    min-width: 0;
}

/* 商品名称 */
  .info h3 {
    margin: 0 0 5px;
    font-size: 12px;
    line-height: 1.2;
    font-weight: 700;
}

/* 商品说明 */
  .description {
    font-size: 9px;
    line-height: 1.2;
    color: #777;
    margin-bottom: 6px;   /* 介绍和价格距离 */
}

/* 价格 */
  .price {
    font-weight: 700;
    font-size: 13px;
}

/* 普通 + 按钮 */
  .add {
    border: none;   /* 去掉边框 */
    width: 35px;
    height: 35px;
    min-width: 35px;
    border-radius: 50%;   /* 变圆形 */
    background: #FFEAAB;
    color: #5cb5f0;
    font-size: 17px;
    cursor: pointer;
}

/* 有选项的 Elegir */
  .add.has-options {
    width: 50px;
    height: 30px;
    min-width: 50px;
    border-radius: 19px;   /* 做成胶囊 */
    background: #FFEAAB;
    color: #5cb5f0;
    font-size: 11px;
    font-weight: 600;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
}
    
/* 购物车 */
  .cart {
    position: fixed;   /* 固定在屏幕上 */
    bottom: calc(70px + env(safe-area-inset-bottom));   /* 控制购物车距离屏幕底部位置 */
    left: 15px;
    right: 15px;
    max-width: 570px;   /* 最大宽度 */
    margin: auto;
    background: #8ed8f8;
    color: white;
    padding: 14px 18px;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
}

  .bottom-space {
    height: 78px;   /* 页面底部占位空白 */
}
    
/* 底部导航 */
    .bottom-nav {   /* 白色导航栏 */
       position: fixed;   /* 固定在底部 */
       left: 50%;
       bottom: 0;   /* 屏幕最下面 */
       transform: translateX(-50%);
       width: 100%;   /* 手机上占宽 */
       max-width: 480px;
       height: 72px;   /* 底部导航栏高度 */
       background: #ffffff;
       border-top: 1px solid #eeeeee;   /* 分割线 */
       display: flex;  /* 四个按钮横向排列 */
       justify-content: space-around;   /* 四个按钮平均分布 */
       align-items: center;   /* 四个按钮上下居中 */
       padding-bottom: env(safe-area-inset-bottom);
       z-index: 9999;   /* 让底部导航栏处于页面最上层 */
}
   .bottom-nav a,
   .bottom-nav .nav-item {
       text-decoration: none !important;
}

    .nav-item {   /* 每个按钮 */
       flex: 1;   /* 四个按钮平均分配宽度 */
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       gap: 4px;   /* 图标和文字距离 */
       color: #9a9a9a;   /* 没选中的颜色 */
       font-size: 11px;
       font-weight: 600;   /* 文字粗细 */
       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;   /* 字体 */
       -webkit-tap-highlight-color: transparent;    /* 手机点击链接时不出现浏览器默认方块 */
}

    .nav-icon {   /* 图标 */
       position: relative;
       display: flex;
       align-items: center;
       justify-content: center;
}

    .nav-icon svg {    
       width: 23px;   /* 图标大小 */
       height: 23px;   /* 图标大小 */
       fill: none;   /* 图标内不填充颜色 */
       stroke: currentColor;   /* 图标线条颜色跟随 */
       stroke-width: 1.8;   /* 图标线条粗细 */
       stroke-linecap: round;
       stroke-linejoin: round;
}

    .nav-item.active {   /* 当前页面 */
       color: #8ed8f8;
}

     body {   /* 防止页面内容被底栏挡住 */
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
}
    
  </style>
</head>

<div class="menu-layout">

<script>
const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

// 从浏览器读取购物车
// 读取当前进入菜单的方式
const initialParams = new URLSearchParams(window.location.search);
const initialType = initialParams.get('type');

// 从主页进入外带菜单：先清空旧购物车，再读取购物车
if (initialType === 'takeaway') {
    localStorage.removeItem('paaaani_cart');
    sessionStorage.removeItem('paaaani_cart');

    // 顺便清除之前写错名字留下的旧购物车
    localStorage.removeItem('paaaaani_cart');
    sessionStorage.removeItem('paaaaani_cart');
}

let cart = JSON.parse(localStorage.getItem('paaaani_cart') || '{}');
let allProducts = [];
let allOptions = [];

// 读取之前选择的用餐方式
let selectedOrderType =
    new URLSearchParams(window.location.search).get('type') ||
    localStorage.getItem('paaaani_order_type') ||
    'dinein';

localStorage.setItem('paaaani_order_type', selectedOrderType);

// 默认打开 Café especiales
const defaultCategory = 'a6fca325-d92c-4475-9254-7a9e512cb240';

// 价格格式
function formatPrice(price) {
  return `${Number(price).toFixed(2).replace('.', ',')} €`;
}
const params = new URLSearchParams(window.location.search);
const urlType = params.get('type');

if (urlType === 'dinein' || urlType === 'takeaway') {
  localStorage.setItem('paaani_order_type', urlType);
}

if (!localStorage.getItem('paaani_order_type')) {
  localStorage.setItem('paaani_order_type', 'dinein');
}

// 读取商品 + 商品选项
// =========================
async function loadProducts() {
  try {

    const [productsResponse, optionsResponse] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      ),

      fetch(
        `${SUPABASE_URL}/rest/v1/product_options?select=*&is_available=eq.true&order=sort_order.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      )
    ]);

    if (!productsResponse.ok) {
      throw new Error(`Products Error ${productsResponse.status}`);
    }


    allProducts = await productsResponse.json();
   allOptions = optionsResponse.ok ? await optionsResponse.json() : [];
    console.log('Productos:', allProducts);
    console.log('Opciones:', allOptions);

    // 默认只显示 Café especiales
    const defaultProducts = allProducts
  .filter(product => product.category_id === defaultCategory)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)); 

    renderProducts(defaultProducts.length > 0 ? defaultProducts : allProducts);

  } catch (error) {

    console.error('Error al cargar datos:', error);

    document.querySelector('.menu').innerHTML = `
      <p>No se pudieron cargar los productos.</p >
    `;
  }
}


// =========================
// 显示商品
// =========================
function renderProducts(products) {

  const menu = document.querySelector('.menu');

  menu.innerHTML = '';

  products.forEach(product => {

    const item = document.createElement('div');

    item.className = 'product';

    // 判断这个商品有没有选项
    const productOptions = allOptions.filter(option =>
      option.product_id === product.id &&
      option.is_available !== false
    );

    const hasOptions = productOptions.length > 0;

    item.innerHTML = `
      ${
        product.image_url
          ? `<img src="${product.image_url}" alt="${product.name}">`
          : ''
      }

      <div class="info">

        <h3>${product.name}</h3>

        <div class="description">
          ${product.description || ''}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

      </div>

      <button
        class="add ${hasOptions ? 'has-options' : ''}"
        type="button"
        data-product-id="${product.id}"
      >
        ${hasOptions ? 'Elegir' : '+'}
      </button>
    `;

    item.querySelector('.add').addEventListener('click', () => {
      handleAddProduct(product);
    });

    menu.appendChild(item);
  });

  updateProductButtons();
}

// =========================
// 点击商品 +
// =========================
  function updateProductButtons() {
    document.querySelectorAll('.add[data-product-id]').forEach(button => {

        // 有商品选项 → 始终显示 Elegir
        if (button.classList.contains('has-options')) {
            button.textContent = 'Elegir';
            return;
        }

        // 没有选项 → 显示数量或 +
        const productId = button.dataset.productId;

        const quantity = Object.values(cart)
            .filter(item => String(item.id) === String(productId))
            .reduce(
                (total, item) => total + Number(item.quantity || 0),
                0
            );

        button.textContent = quantity > 0 ? quantity : '+';
    });
}
function handleAddProduct(product) {

  const options = allOptions.filter(option =>
    option.product_id === product.id &&
    option.is_available !== false
  );

  // 没有大小选项 → 直接加入
  if (options.length === 0) {
    addToCart(product, null);
    return;
  }

  // 有选项 → 打开选择窗口
  openOptionModal(product, options);
}

function openOptionModal(product, options) {

    const oldModal = document.getElementById('optionOverlay');

    if (oldModal) {
        oldModal.remove();
    }

    const groupName = options[0]?.group_name || 'Tamaño';

    const overlay = document.createElement('div');

    overlay.id = 'optionOverlay';

    overlay.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:2000;
        display:flex;
        align-items:flex-end;
        justify-content:center;
    `;

    overlay.innerHTML = `
        <div style="
            background:white;
            width:100%;
            max-width:600px;
            padding:20px 18px 26px;
            margin-bottom:72px;
            border-radius:24px 24px 0 0;
            max-height:calc(100vh - 72px);
            overflow-y:auto;
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:18px;
            ">

                <h2 style="
                    margin:0;
                    font-size:21px;
                    font-weight:700;
                    letter-spacing:-0.2px;
                ">
                    ${product.name}
                </h2>

                <button
                    id="closeOptionModal"
                    type="button"
                    style="
                        border:none;
                        background:none;
                        font-size:30px;
                        cursor:pointer;
                        color:#1688E8;
                    "
                >
                    ×
                </button>

            </div>

            <h3 style="
                  margin:0 0 12px;
                  font-size:15px;
                  font-weight:600;
                  color:#333;
            ">
                  ${groupName}
             </h3>
             
            <div id="optionButtons"></div>

        </div>
    `;

    document.body.appendChild(overlay);

    const buttonsContainer =
        document.getElementById('optionButtons');

/* =========================
   EXTRAS → 多选
========================= */

if (groupName.toLowerCase() === 'extras') {

    let selectedOptions = [];

    const getOptionKey = (option) => {
        return String(
            option.id ??
            option.option_name
        );
    };

    const renderExtras = () => {

        const totalExtra = selectedOptions.reduce(
           (sum, index) =>
        sum + Number(options[index].price_delta || 0),
            0
     );

        buttonsContainer.innerHTML = '';

        options.forEach((option, index) => {

            const optionKey = getOptionKey(option);

            const selected =
                 selectedOptions.includes(index);

            const row =
                document.createElement('button');

            row.type = 'button';

            row.style.cssText = `
                width:100%;
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:16px 18px;
                margin-bottom:10px;
                border:2px solid ${selected ? '#8ED8F8' : '#E5E5E5'};
                border-radius:16px;
                background:${selected ? '#F4FCFF' : '#fff'};
                color:#222;
                font-size:17px;
                font-weight:700;
                cursor:pointer;
            `;

            row.innerHTML = `
                <span style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                ">

                    <span style="
                        width:22px;
                        height:22px;
                        border:2px solid #8ED8F8;
                        border-radius:6px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#8ED8F8;
                        font-size:16px;
                        flex-shrink:0;
                    ">
                        ${selected ? '✓' : ''}
                    </span>

                    <span>
                        ${option.option_name}
                    </span>

                </span>

                <span>
                    +${formatPrice(
                        Number(option.price_delta || 0)
                    )}
                </span>
            `;

            row.addEventListener('click', () => {

    if (selectedOptions.includes(index)) {

        // 已选择 → 取消
        selectedOptions =
            selectedOptions.filter(
                i => i !== index
            );

    } else {

        // 未选择 → 加入
        selectedOptions.push(index);

    }

    renderExtras();
});

            buttonsContainer.appendChild(row);
        });


        /* =========================
           总价 + 加入购物车
        ========================= */

        const totalBox =
            document.createElement('div');

        totalBox.style.cssText = `
            margin-top:16px;
        `;

        totalBox.innerHTML = `

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:12px;
                font-size:18px;
                font-weight:800;
            ">
                <span>Total</span>

                <span>
                    ${formatPrice(
                        Number(product.price) + totalExtra
                    )}
                </span>
            </div>

            <button
                id="confirmExtras"
                type="button"
                style="
                    width:100%;
                    height:50px;
                    border:none;
                    border-radius:16px;
                    background:#8ED8F8;
                    color:white;
                    font-size:17px;
                    font-weight:800;
                    cursor:pointer;
                "
            >
                Añadir al pedido
            </button>
        `;

        buttonsContainer.appendChild(totalBox);


        document
            .getElementById('confirmExtras')
            .addEventListener('click', () => {

                if (selectedOptions.length === 0) {

                    addToCart(product, null);

                } else {

                   const combinedOption = {
    id:
        'extras_' +
        selectedOptions
            .map(index => options[index].option_name)
            .join('_'),

    option_name:
        selectedOptions
            .map(index => options[index].option_name)
            .join(' + '),

    group_name: 'Extras',

    price_delta:
        totalExtra
};

                    addToCart(
                        product,
                        combinedOption
                    );
                }

                overlay.remove();
            });
    };

    renderExtras();

} else {
        /* =========================
           其他选项 → 保持单选
        ========================= */

        options.forEach(option => {

            const finalPrice =
                Number(product.price) +
                Number(option.price_delta || 0);

            const button =
                document.createElement('button');

            button.type = 'button';

            button.style.cssText = `
                width:100%;
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:16px 18px;
                margin-bottom:10px;
                border:2px solid #8ED8F8;
                border-radius:16px;
                background:white;
                color:#222;
                font-size:17px;
                font-weight:700;
                cursor:pointer;
            `;

            button.innerHTML = `
                <strong>
                    ${option.option_name}
                </strong>

                <span>
                    +${formatPrice(Number(option.price_delta || 0))}
                </span>
            `;

            button.addEventListener('click', () => {

                addToCart(product, option);

                overlay.remove();

            });

            buttonsContainer.appendChild(button);
        });
    }


    document
        .getElementById('closeOptionModal')
        .addEventListener('click', () => {
            overlay.remove();
        });


    overlay.addEventListener('click', event => {

        if (event.target === overlay) {
            overlay.remove();
        }

    });
}

document.querySelectorAll('.categories button').forEach(button => {

  button.addEventListener('click', () => {

    document.querySelectorAll('.categories button').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    const category =
      button.dataset.category;

    if (category === 'all') {
      renderProducts(allProducts);
      return;
    }

    const filteredProducts = allProducts
  .filter(product => product.category_id === category)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

renderProducts(filteredProducts);
  });
});


// =========================
// 加入购物车
// =========================
function addToCart(product, option) {

  const optionId =
    option ? option.id : 'normal';

  // 同一个商品不同大小分开
  const cartKey =
    `${product.id}_${optionId}`;

  const priceDelta =
    option
      ? Number(option.price_delta || 0)
      : 0;

  const finalPrice =
    Number(product.price) + priceDelta;

  if (cart[cartKey]) {

    cart[cartKey].quantity += 1;

  } else {

    cart[cartKey] = {

      ...product,

      cartKey: cartKey,

      optionId:
        option ? option.id : null,

      optionName:
        option ? option.option_name : null,

      groupName:
        option ? option.group_name : null,

      basePrice:
        Number(product.price),

      price:
        finalPrice,

      quantity: 1
    };
  }

  updateCartBar();
updateProductButtons();
}


// =========================
// 修改数量
// =========================
function changeQuantity(cartKey, amount) {

  if (!cart[cartKey]) return;

  cart[cartKey].quantity += amount;

  if (cart[cartKey].quantity <= 0) {
    delete cart[cartKey];
  }

  updateCartBar();
renderCart();
updateProductButtons();
}


// =========================
// 商品总数量
// =========================
function getCartCount() {

  return Object.values(cart).reduce(
    (total, product) =>
      total + product.quantity,
    0
  );
}


// =========================
// 总价
// =========================
function getCartTotal() {

  return Object.values(cart).reduce(
    (total, product) =>
      total +
      Number(product.price) *
      product.quantity,
    0
  );
}


// =========================
// 更新底部购物车
// =========================
function updateCartBar() {

  // 保存购物车，跳到 checkout.html 后还能读取
  localStorage.setItem('paaani_cart', JSON.stringify(cart));

  const count = getCartCount();

  const cartText =
    document.querySelector('.cart span:last-child');

  cartText.textContent =
    `${count} ${
      count === 1
        ? 'producto'
        : 'productos'
    } · ${formatPrice(getCartTotal())}`;
}

// =========================
// 打开购物车
// =========================
function openCart() {

  renderCart();

  document
    .getElementById('cartOverlay')
    .style.display = 'flex';
}


// =========================
// 关闭购物车
// =========================
function closeCart() {

  document
    .getElementById('cartOverlay')
    .style.display = 'none';
}


// =========================
// 显示购物车
// =========================
function renderCart() {

  const cartItems =
    document.getElementById('cartItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {

    cartItems.innerHTML = `

      <p style="
        text-align:center;
        color:#777;
        padding:30px 0;
      ">
        Tu pedido está vacío
      </p >
    `;

  } else {

    cartItems.innerHTML =
      products.map(product => `

        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          padding:14px 0;
          border-bottom:1px solid #eee;
        ">

          ${
            product.image_url
              ? `
                <img
                  src="${product.image_url}"
                  alt="${product.name}"
                  style="
                    width:60px;
                    height:60px;
                    object-fit:cover;
                    border-radius:12px;
                  "
                >
              `
              : ''
          }

          <div style="flex:1;">

            <strong>
              ${product.name}
            </strong>

            ${
              product.optionName
                ? `
                  <div style="
                    margin-top:4px;
                    font-size:14px;
                    color:#777;
                  ">
                    ${product.optionName}
                  </div>
                `
                : ''
            }

            <div style="margin-top:5px;">
              ${formatPrice(product.price)}
            </div>

          </div>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', -1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              font-size:20px;
              cursor:pointer;
            "
          >
            −
          </button>

          <strong>
            ${product.quantity}
          </strong>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', 1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              background:#FFEAAB;
              font-size:20px;
              cursor:pointer;
            "
          >
            +
          </button>

        </div>

      `).join('');
  }

  document
    .getElementById('cartTotal')
    .textContent =
      formatPrice(getCartTotal());
}
