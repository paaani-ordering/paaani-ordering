<script>
const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

// 从浏览器读取购物车
let cart = JSON.parse(localStorage.getItem('paaani_cart') || '{}');
let allProducts = [];
let allOptions = [];

// 默认打开 Café especiales
const defaultCategory = 'a6fca325-d92c-4475-9254-7a9e512cb240';

// 价格格式
function formatPrice(price) {
  return `${Number(price).toFixed(2).replace('.', ',')} €`;
}

// =========================
// 读取商品 + 商品选项
// =========================
async function loadProducts() {
  try {

    const [productsResponse, optionsResponse] = await Promise.all([
      fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      ),

      fetch(
        `${SUPABASE_URL}/rest/v1/product_options?select=*&is_available=eq.true&order=sort_order.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      )
    ]);

    if (!productsResponse.ok) {
      throw new Error(`Products Error ${productsResponse.status}`);
    }

    if (!optionsResponse.ok) {
      throw new Error(`Options Error ${optionsResponse.status}`);
    }

    allProducts = await productsResponse.json();
    allOptions = await optionsResponse.json();

    console.log('Productos:', allProducts);
    console.log('Opciones:', allOptions);

    // 默认只显示 Café especiales
    const defaultProducts = allProducts
  .filter(product => product.category_id === defaultCategory)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)); 

    renderProducts(defaultProducts);

  } catch (error) {

    console.error('Error al cargar datos:', error);

    document.querySelector('.menu').innerHTML = `
      <p>No se pudieron cargar los productos.</p >
    `;
  }
}


// =========================
// 显示商品
// =========================
function renderProducts(products) {

  const menu = document.querySelector('.menu');

  menu.innerHTML = '';

  products.forEach(product => {

    const item = document.createElement('div');

    item.className = 'product';

    item.innerHTML = `
      ${
        product.image_url
          ? `<img src="${product.image_url}" alt="${product.name}">`
          : ''
      }

      <div class="info">

        <h3>${product.name}</h3>

        <div class="description">
          ${product.description || ''}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
        </div>

      </div>

      <button class="add" type="button">+</button>
    `;

    item.querySelector('.add').addEventListener('click', () => {
      handleAddProduct(product);
    });

    menu.appendChild(item);
  });
}


// =========================
// 点击商品 +
// =========================
function handleAddProduct(product) {

  const options = allOptions.filter(option =>
    option.product_id === product.id &&
    option.is_available !== false
  );

  // 没有大小选项 → 直接加入
  if (options.length === 0) {
    addToCart(product, null);
    return;
  }

  // 有选项 → 打开选择窗口
  openOptionModal(product, options);
}


// =========================
// 打开大小选择窗口
// =========================
function openOptionModal(product, options) {

  const oldModal = document.getElementById('optionOverlay');

  if (oldModal) {
    oldModal.remove();
  }

  const groupName =
    options[0]?.group_name || 'Tamaño';

  const overlay = document.createElement('div');

  overlay.id = 'optionOverlay';

  overlay.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:2000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  `;

  overlay.innerHTML = `

    <div style="
      background:white;
      width:100%;
      max-width:600px;
      border-radius:24px 24px 0 0;
      padding:24px 20px 30px;
    ">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:8px;
      ">

        <h2 style="
          margin:0;
          font-size:24px;
        ">
          ${product.name}
        </h2>

        <button
          id="closeOptionModal"
          type="button"
          style="
            border:none;
            background:none;
            font-size:30px;
            cursor:pointer;
          "
        >
          ×
        </button>

      </div>

      <div style="
        font-size:16px;
        font-weight:bold;
        margin:20px 0 12px;
      ">
        ${groupName}
      </div>

      <div id="optionButtons"></div>

    </div>
  `;

  document.body.appendChild(overlay);

  const buttonsContainer =
    document.getElementById('optionButtons');

  options.forEach(option => {

    const finalPrice =
      Number(product.price) +
      Number(option.price_delta || 0);

    const button =
      document.createElement('button');

    button.type = 'button';

    button.style.cssText = `
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 18px;
      margin-bottom:10px;
      border:2px solid #8ed8f8;
      border-radius:16px;
      background:white;
      color:#222;
      font-size:17px;
      cursor:pointer;
    `;

    button.innerHTML = `
      <strong>${option.option_name}</strong>

      <span>
        ${formatPrice(finalPrice)}
      </span>
    `;

    button.addEventListener('click', () => {

      addToCart(product, option);

      overlay.remove();
    });

    buttonsContainer.appendChild(button);
  });

  document
    .getElementById('closeOptionModal')
    .addEventListener('click', () => {
      overlay.remove();
    });

  // 点黑色背景关闭
  overlay.addEventListener('click', event => {

    if (event.target === overlay) {
      overlay.remove();
    }
  });
}


// =========================
// 分类按钮
// =========================
document.querySelectorAll('.categories button').forEach(button => {

  button.addEventListener('click', () => {

    document.querySelectorAll('.categories button').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    const category =
      button.dataset.category;

    if (category === 'all') {
      renderProducts(allProducts);
      return;
    }

    const filteredProducts = allProducts
  .filter(product => product.category_id === category)
  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

renderProducts(filteredProducts);
  });
});


// =========================
// 加入购物车
// =========================
function addToCart(product, option) {

  const optionId =
    option ? option.id : 'normal';

  // 同一个商品不同大小分开
  const cartKey =
    `${product.id}_${optionId}`;

  const priceDelta =
    option
      ? Number(option.price_delta || 0)
      : 0;

  const finalPrice =
    Number(product.price) + priceDelta;

  if (cart[cartKey]) {

    cart[cartKey].quantity += 1;

  } else {

    cart[cartKey] = {

      ...product,

      cartKey: cartKey,

      optionId:
        option ? option.id : null,

      optionName:
        option ? option.option_name : null,

      groupName:
        option ? option.group_name : null,

      basePrice:
        Number(product.price),

      price:
        finalPrice,

      quantity: 1
    };
  }

  updateCartBar();
}


// =========================
// 修改数量
// =========================
function changeQuantity(cartKey, amount) {

  if (!cart[cartKey]) return;

  cart[cartKey].quantity += amount;

  if (cart[cartKey].quantity <= 0) {
    delete cart[cartKey];
  }

  updateCartBar();
  renderCart();
}


// =========================
// 商品总数量
// =========================
function getCartCount() {

  return Object.values(cart).reduce(
    (total, product) =>
      total + product.quantity,
    0
  );
}


// =========================
// 总价
// =========================
function getCartTotal() {

  return Object.values(cart).reduce(
    (total, product) =>
      total +
      Number(product.price) *
      product.quantity,
    0
  );
}


// =========================
// 更新底部购物车
// =========================
function updateCartBar() {

  // 保存购物车，跳到 checkout.html 后还能读取
  localStorage.setItem('paaani_cart', JSON.stringify(cart));

  const count = getCartCount();

  const cartText =
    document.querySelector('.cart span:last-child');

  cartText.textContent =
    `${count} ${
      count === 1
        ? 'producto'
        : 'productos'
    } · ${formatPrice(getCartTotal())}`;
}

// =========================
// 打开购物车
// =========================
function openCart() {

  renderCart();

  document
    .getElementById('cartOverlay')
    .style.display = 'flex';
}


// =========================
// 关闭购物车
// =========================
function closeCart() {

  document
    .getElementById('cartOverlay')
    .style.display = 'none';
}


// =========================
// 显示购物车
// =========================
function renderCart() {

  const cartItems =
    document.getElementById('cartItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {

    cartItems.innerHTML = `

      <p style="
        text-align:center;
        color:#777;
        padding:30px 0;
      ">
        Tu pedido está vacío
      </p >
    `;

  } else {

    cartItems.innerHTML =
      products.map(product => `

        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          padding:14px 0;
          border-bottom:1px solid #eee;
        ">

          ${
            product.image_url
              ? `
                <img
                  src="${product.image_url}"
                  alt="${product.name}"
                  style="
                    width:60px;
                    height:60px;
                    object-fit:cover;
                    border-radius:12px;
                  "
                >
              `
              : ''
          }

          <div style="flex:1;">

            <strong>
              ${product.name}
            </strong>

            ${
              product.optionName
                ? `
                  <div style="
                    margin-top:4px;
                    font-size:14px;
                    color:#777;
                  ">
                    ${product.optionName}
                  </div>
                `
                : ''
            }

            <div style="margin-top:5px;">
              ${formatPrice(product.price)}
            </div>

          </div>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', -1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              font-size:20px;
              cursor:pointer;
            "
          >
            −
          </button>

          <strong>
            ${product.quantity}
          </strong>

          <button
            type="button"
            onclick="changeQuantity('${product.cartKey}', 1)"
            style="
              width:34px;
              height:34px;
              border:none;
              border-radius:50%;
              background:#FFEAAB;
              font-size:20px;
              cursor:pointer;
            "
          >
            +
          </button>

        </div>

      `).join('');
  }

  document
    .getElementById('cartTotal')
    .textContent =
      formatPrice(getCartTotal());
}


// =========================
// 点击底部购物车
// =========================
document
  .querySelector('.cart')
  .addEventListener('click', openCart);


// =========================

// =========================
document.body.insertAdjacentHTML(

        <button

            border:none;

            font-size:28px;
            cursor:pointer;
          "
        >
          ×
        </button>

      </div>

      <div id="cartItems"></div>

      <div style="
        display:flex;
        justify-content:space-between;

        padding-top:20px;
      ">

        <span>Total</span>

        <span id="cartTotal">
          0,00 €
        </span>

      </div>

      <button
        id="checkoutButton"
        type="button"
        style="
          display:block;

          font-size:17px;

          cursor:pointer;
        "
      >
        Confirmar pedido
      </button>

    </div>

  </div>
  `
);


// =========================
// 开始加载
// =========================

// 先显示已经保存的购物车数量
updateCartBar();

// 再加载商品

// ========================

if (typeFromHome === 'takeaway') {

}

// URL 有合法 type，就优先使用；否则读取之前保存的状态

if (typeFromHome === 'takeaway' || typeFromHome === 'dinein') {

function updateOrderTypeButtons() {
