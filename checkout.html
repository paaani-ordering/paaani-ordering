<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirmar pedido | Paaaani Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #f7f7f5;
      padding-bottom: 40px;
    }

    /* 顶部 */
    .header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #eee;
    }

    .back {
      position: absolute;
      left: 20px;
      border: none;
      background: none;
      font-size: 30px;
      cursor: pointer;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
    }

    .content {
      padding: 20px;
    }

    /* 堂食/外带 */
    .type-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .type-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 7px;
    }

    .type-value {
      font-size: 20px;
      font-weight: 700;
    }

    /* 商品 */
    .order-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .order-card h2,
    .info-card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .order-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-item img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .item-option {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .item-price {
      font-size: 14px;
      color: #666;
    }

    .quantity {
      font-weight: 700;
    }

    /* 总价 */
    .total {
      display: flex;
      justify-content: space-between;
      padding-top: 18px;
      margin-top: 8px;
      border-top: 1px solid #eee;
      font-size: 20px;
      font-weight: 700;
    }

    /* 信息 */
    .info-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8ed8f8;
    }

    /* 最终下单 */
    .submit {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      background: #FFEAAB;
      color: #222;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="header">

    <button
      class="back"
      type="button"
      onclick="history.back()"
    >
      ‹
    </button>

    <h1>Confirmar pedido</h1>

  </div>


  <main class="content">

    <!-- 堂食 / 外带 -->
    <section class="type-card">

      <div class="type-label">
        Tipo de pedido
      </div>

      <div
        class="type-value"
        id="orderType"
      ></div>

    </section>


    <!-- 商品 -->
    <section class="order-card">

      <h2>Tu pedido</h2>

      <div id="orderItems"></div>

      <div class="total">

        <span>Total</span>

        <span id="totalPrice">
          0,00 €
        </span>

      </div>

    </section>

        <!-- 优惠券 -->
    <section class="info-card" id="couponCard">

      <h2>Mis cupones</h2>

      <div id="couponArea">
        <p style="color:#888;font-size:14px;">
          Cargando cupones...
        </p>
      </div>

    </section>

    <!-- 客人信息 -->
    <section class="info-card">

      <h2>Tus datos</h2>

      <!-- 外带 -->
      <div
        class="field"
        id="phoneField"
        style="display:none;"
      >

        <label for="phone">
          Teléfono
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="Tu teléfono"
        >

      </div>

    </section>


    <button
      class="submit"
      id="submitOrder"
      type="button"
    >
      Realizar pedido
    </button>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<script>

const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const cartData = localStorage.getItem('paaaani_cart');

const cart = JSON.parse(cartData || '{}');
  
const orderType =
  localStorage.getItem('paaani_order_type')
  || 'dinein';

// =========================
// 自动读取二维码里的桌号
// 例如：checkout.html?table=5
// =========================
const params = new URLSearchParams(window.location.search);

const tableNumber =
  params.get('table') ||
  localStorage.getItem('paaani_table_number');

if (tableNumber) {
  localStorage.setItem('paaani_table_number', tableNumber);
}
function formatPrice(price) {

  return `${Number(price)
    .toFixed(2)
    .replace('.', ',')} €`;
}


// ========================
// 堂食 / 外带
// ========================

const orderTypeElement =
  document.getElementById('orderType');

const tableField =
  document.getElementById('tableField');

const phoneField =
  document.getElementById('phoneField');

if (orderType === 'takeaway') {
  orderTypeElement.textContent = 'Para llevar';

  if (tableField) {
    tableField.style.display = 'none';
  }

  if (phoneField) {
    phoneField.style.display = 'block';
  }

} else {
  orderTypeElement.textContent = 'Comer aquí';

  if (tableField) {
    tableField.style.display = 'block';
  }

  if (phoneField) {
    phoneField.style.display = 'none';
  }
}

// ========================
// 显示商品
// ========================

let orderSubtotal = 0;
let selectedUserCoupon = null;
  
function renderOrder() {

  const container =
    document.getElementById('orderItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {

    container.innerHTML =
      '<p>Tu pedido está vacío</p>';

    return;
  }


  container.innerHTML =
    products.map(product => `

      <div class="order-item">

        ${
          product.image_url
            ? `
              <img
                src="${product.image_url}"
                alt="${product.name}"
              >
            `
            : ''
        }

        <div class="item-info">

          <div class="item-name">
            ${product.name}
          </div>

          ${
            product.optionName
              ? `
                <div class="item-option">
                  ${product.optionName}
                </div>
              `
              : ''
          }

          <div class="item-price">
            ${formatPrice(product.basePrice ?? product.price ?? 0)}
          </div>

        </div>

        <div class="quantity">
          ×${product.quantity}
        </div>

      </div>

    `).join('');


 orderSubtotal = products.reduce((sum, product) => {

  const price = Number(
    product.basePrice ??
    product.price ??
    0
  );

  const quantity = Number(
    product.quantity ?? 1
  );

  return sum + price * quantity;

}, 0);
console.log('PRODUCTS:', products);
console.log('ORDER SUBTOTAL:', orderSubtotal);
document
  .getElementById('totalPrice')
  .textContent = formatPrice(orderSubtotal);
}


renderOrder();

// ========================
// 读取当前用户可使用的优惠券
// ========================

function updateTotal() {

  let discount = 0;

  if (selectedUserCoupon && selectedUserCoupon.coupons) {

    const coupon = selectedUserCoupon.coupons;

    const minimum =
      Number(coupon.min_order || 0);

    if (orderSubtotal >= minimum) {

      if (coupon.discount_type === 'percent') {

        discount =
          orderSubtotal *
          Number(coupon.discount_value) / 100;

      } else {

        discount =
          Number(coupon.discount_value || 0);

      }

    }

  }

  // 防止优惠金额超过订单金额
  discount = Math.min(discount, orderSubtotal);

  const finalTotal =
    Math.max(0, orderSubtotal - discount);

  document
    .getElementById('totalPrice')
    .textContent =
      formatPrice(finalTotal);
}
  
async function loadMyCoupons() {

  const couponArea =
    document.getElementById('couponArea');

  try {

    // 1. 获取当前登录用户
    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {
      throw userError;
    }

    // 没登录
    if (!user) {

      couponArea.innerHTML = `
        <p style="color:#888;font-size:14px;">
          Inicia sesión para usar tus cupones.
        </p>
      `;

      return;
    }


    // 2. 读取这个用户领取的、尚未使用的优惠券
    const {
      data: userCoupons,
      error: couponError
    } = await supabaseClient
      .from('user_coupons')
      .select(`
        id,
        coupon_id,
        expires_at,
        is_used,
        coupons (
          id,
          title,
          description,
          discount_type,
          discount_value,
          min_order
        )
      `)
      .eq('user_id', user.id)
      .eq('is_used', false);

    if (couponError) {
      throw couponError;
    }


    // 3. 去掉已经过期的优惠券
    const now = new Date();

    const availableCoupons =
      (userCoupons || []).filter(item => {

        if (!item.expires_at) {
          return true;
        }

        return new Date(item.expires_at) > now;

      });


    if (availableCoupons.length === 0) {

      couponArea.innerHTML = `
        <p style="color:#888;font-size:14px;">
          No tienes cupones disponibles.
        </p>
      `;

      return;
    }


    // 4. 显示优惠券
    couponArea.innerHTML =
      availableCoupons.map(item => {

        const coupon = item.coupons;

        if (!coupon) {
          return '';
        }

        let valueText = '';

        if (coupon.discount_type === 'percent') {
          valueText = `${coupon.discount_value}%`;
        } else {
          valueText = `${Number(coupon.discount_value)
            .toFixed(2)
            .replace('.', ',')} €`;
        }

        return `
          <div
            class="checkout-coupon"
            data-user-coupon-id="${item.id}"
            style="
              border:1px solid #e7e7e7;
              border-radius:16px;
              padding:15px;
              margin-bottom:10px;
              cursor:pointer;
              background:#fff;
            "
          >

            <div style="
              display:flex;
              justify-content:space-between;
              gap:12px;
              align-items:center;
            ">

              <div>

                <div style="
                  font-weight:700;
                  margin-bottom:5px;
                ">
                  ${coupon.title}
                </div>

                <div style="
                  font-size:13px;
                  color:#888;
                ">
                  ${coupon.description || ''}
                </div>

              </div>

              <div style="
                font-size:18px;
                font-weight:700;
                white-space:nowrap;
              ">
                ${valueText}
              </div>

            </div>

          </div>
        `;

      }).join('');
document
  .querySelectorAll('.checkout-coupon')
  .forEach(element => {

    element.addEventListener('click', () => {

      const id =
        Number(
          element.dataset.userCouponId
        );

      const coupon =
        availableCoupons.find(
          item => Number(item.id) === id
        );

      if (!coupon) {
        return;
      }


      // 再点一次 = 取消选择
      if (
        selectedUserCoupon &&
        Number(selectedUserCoupon.id) === id
      ) {

        selectedUserCoupon = null;

        document
          .querySelectorAll('.checkout-coupon')
          .forEach(card => {

            card.style.border =
              '1px solid #e7e7e7';

            card.style.background =
              '#fff';

          });

        updateTotal();

        return;
      }


      // 检查最低消费
      const minimum =
        Number(
          coupon.coupons?.min_order || 0
        );

      if (orderSubtotal < minimum) {

        alert(
          `Pedido mínimo: ${formatPrice(minimum)}`
        );

        return;
      }


      selectedUserCoupon = coupon;


      // 恢复其他优惠券样式
      document
        .querySelectorAll('.checkout-coupon')
        .forEach(card => {

          card.style.border =
            '1px solid #e7e7e7';

          card.style.background =
            '#fff';

        });


      // 当前选中的券
      element.style.border =
        '2px solid #8ed8f8';

      element.style.background =
        '#f2fbff';


      updateTotal();

    });

  });
  } catch (error) {

    console.error('Error cargando cupones:', error);

    couponArea.innerHTML = `
      <p style="color:#d66;font-size:14px;">
        No se pudieron cargar los cupones.
      </p>
    `;

  }

}


// 加载优惠券
loadMyCoupons();
// ========================
// 最终提交
// ========================

document
  .getElementById('submitOrder')
  .addEventListener('click', async () => {

    let table = '';
    let phone = '';


    // ========================
    // 堂食：检查桌号
    // ========================

    if (orderType === 'dinein') {

      const tableInput =
        document.getElementById('tableNumber');

      table =
        tableInput
          ? tableInput.value.trim()
          : '';

      if (!table) {

        alert('Introduce el número de mesa.');

        return;
      }
    }


    // ========================
    // 外带：检查电话号码
    // ========================

    if (orderType === 'takeaway') {

      const phoneInput =
        document.getElementById('phone');

      phone =
        phoneInput
          ? phoneInput.value.trim()
          : '';

      if (!phone) {

        alert('Introduce tu teléfono.');

        return;
      }
    }


    // ========================
    // 获取当前登录用户
    // ========================

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();


    if (userError) {

      console.error(
        'Error al obtener el usuario:',
        userError
      );

      alert('Error al comprobar tu cuenta.');

      return;
    }


    if (!user) {

      alert(
        'Inicia sesión para realizar el pedido.'
      );

      return;
    }


    // ========================
    // 生成订单编号
    // ========================

    const orderNumber =
      'PAA-' + Date.now();

    // ========================
// 使用页面已经计算好的订单金额
// ========================

const orderTotal = Number(orderSubtotal);


    // ========================
    // 订单备注
    // ========================

    let orderNotes = '';

    if (orderType === 'dinein') {

      orderNotes =
        'Mesa: ' + table;

    } else {

      orderNotes =
        'Teléfono: ' + phone;
    }


    // ========================
    // 写入 orders
    // ========================

    const {
      data: newOrder,
      error: orderError
    } = await supabaseClient
      .from('orders')
      .insert({

        order_number: orderNumber,

        user_id: user.id,

        order_type: orderType,

        status: 'new',

        payment_status: 'unpaid',

        stamp_awarded: false,

        total_amount: orderTotal,

        notes: orderNotes

      })
      .select()
      .single();


    // ========================
    // 下单失败
    // ========================

    if (orderError) {

      console.error(
        'Error al crear el pedido:',
        orderError
      );

      alert(
        'No se pudo crear el pedido.'
      );

      return;
    }


    // ========================
    // 下单成功
    // ========================

    console.log(
      'Pedido creado:',
      newOrder
    );


    alert(
      'Pedido realizado correctamente.'
    );

  });
</script>

</body>
</html>
