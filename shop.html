<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda | Paaani Café</title>

<style>
:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#FFFFFF;
    --shadow:0 10px 30px rgba(0,0,0,.08);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

body{
    background:#f7f9fc;
    color:var(--text);
}

.container{
    width:100%;
    max-width:none;
    padding:0 0;
    box-sizing:border-box;
}

.header{
    background:linear-gradient(135deg,#8ED8F8,#9DDCF9);
    color:#fff;
    padding:28px 16px 18px;
    border-bottom-left-radius:40px;
    border-bottom-right-radius:40px;
}

.header h1{
    font-size:15px;
    font-weight:800;
    margin-bottom:10px;
    margin-top:4px;
    line-height:1.1;
}

.header p{
    font-size:15px;
    opacity:.92;
}

.points-card{
    width:100%;
    margin:-28px 0 12px;
    padding:16px;
    border-radius:28px;
    box-sizing:border-box;
}
.points-title{
    color:#999;
    font-size:16px;
    font-weight:500;
    margin-bottom:8px;
}
.points{
    font-size:30px;
    font-weight:800;
}

   .points-row{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 12px;
}
    
.member{
    display:inline-flex;
    align-items:center;

    margin-top:0;

    padding:6px 12px;

    font-size:13px;

    border-radius:999px;
}
   
    
/* 分类 */

.categories{
    display:flex;
    gap:28px;
    margin:20px 0 16px;
    border-bottom:1px solid #ECECEC;
}

.category{
    border:none;
    background:none;
    padding:0 0 12px;
    font-size:16px;
    font-weight:600;
    color:#888;
}

.category.active{
    color:#222;
    border-bottom:3px solid #8ED8F8;
}
    /* 签到 */

.checkin-card{
    width:100%;
    background:#fff;
    border-radius:24px;
    padding:14px 18px;
    margin:18px 0;
    box-sizing:border-box;
    box-shadow:0 10px 28px rgba(0,0,0,.04);
}

  .checkin-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}
   .checkin-info{
    flex:1 1 auto;
    min-width:0;
    padding-right:12px;
}
.checkin-title{
    font-size:16px;
    font-weight:700;
    line-height:1.2;
    color:#333;
    margin-bottom:4px;
}
.checkin-desc{
    margin-top:4px;
    font-size:12px;
    color:#8A8A8A;
    line-height:1.35;
}
.checkin-days{
    margin-top:12px;
    gap:10px;
}

.checkin-days span{
    width:32px;
    height:32px;
    font-size:17px;
}

.checkin-days .active{
    background:#8ED8F8;
    color:#fff;
}

.checkin-days .gift{
    font-size:16px;
    background:#FFE58F;
}

.checkin-btn{
    min-width:128px;
    height:46px;
    border-radius:23px;
    font-size:18px;
    font-weight:700;
}
/* 商品 */

.products{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:18px;

}

.product{

    background:white;

    border-radius:22px;

    overflow:hidden;

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:.25s;

}

.product:hover{

    transform:translateY(-3px);

}

.product img{

    width:100%;

    aspect-ratio:1;

    object-fit:cover;

    display:block;

}

.product-info{

    padding:15px;

}

.product-title{

    font-size:16px;

    font-weight:700;

    margin-bottom:8px;

}

.product-points{

    color:#49a6e8;

    font-size:15px;

    font-weight:700;

}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:4px 10px;

    border-radius:999px;

    background:#FFE27A;

    font-size:12px;

    font-weight:700;

}
</style>
</head>

<body>

<header class="header">
    <h1>Tienda</h1>
    <p>Canjea puntos o compra productos Paaani.</p>
</header>

<div class="container">

<div class="points-card">

<div class="points-row">
    <div class="points">1280 Points</div>
    <div class="member">⭐ Gold</div>
</div>
  
<div class="checkin-card">

<div class="checkin-top">

<div class="checkin-info">

            <div class="checkin-desc">
    已连续签到 3 天<br>
    今日奖励 +5 Points
</div>

            <div class="checkin-desc">
                已连续签到 3 天 · 今日 +5 Points
            </div>
        </div>
        <button class="checkin-btn">
            Check in
        </button>
     </div>
  <div class="checkin-days">

        <span class="active">✓</span>
        <span class="active">✓</span>
        <span class="active">✓</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
        <span class="gift">🎁</span>
    
    </div>


</div>
    
<div class="categories">

<button class="category active">Todos</button>

<button class="category">🎟 Cupones</button>

<button class="category">🐶 Merch</button>

</div>

</div>

<div class="products" id="products">
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a>

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a>

 <!-- 商城 -->
<a href="shop.html" class="nav-item active">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a>

</nav>

<style>

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}

/* 防止页面内容被底栏挡住 */
body {
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
}

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 50px rgba(0,0,0,.08);
      }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);
</script>
    <script>

async function loadProducts() {

    const { data, error } = await supabase
        .from("shop_products")
        .select("*")
        .eq("active", true);

    console.log(error);
    console.log(data);

    if (error) {
    alert(error.message);
    return;
}


    const container = document.getElementById("products");

    container.innerHTML = "";

    data.forEach(product => {

        container.innerHTML += `
           <div class="product">

    <img src="${product.image}" alt="${product.name}">

    <div class="product-info">

        <div class="product-title">
            ${product.name}
        </div>

        <div class="product-points">
            ⭐ ${product.points} Points
        </div>

        <div class="badge">
            ${product.badge ?? ""}
        </div>

    </div>

</div>
        `;

    });

}

loadProducts();


</script>
</body>
</html>
