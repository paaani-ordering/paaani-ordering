<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda | Paaani Café</title>

<style>
:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#FFFFFF;
    --shadow:0 10px 30px rgba(0,0,0,.08);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

body{
    background:#f7f9fc;
    color:var(--text);
}

.container{
    width:min(460px,100%);
    margin:auto;
    padding:20px;
    padding-bottom:120px;
}

.header{
    background:linear-gradient(135deg,#8ED8F8,#9DDCF9);
    color:#fff;
    padding:56px 28px 42px;
    border-bottom-left-radius:42px;
    border-bottom-right-radius:42px;
}

.header h1{
    font-size:48px;
    font-weight:800;
    margin-bottom:10px;
    line-height:1.1;
}

.header p{
    font-size:18px;
    opacity:.92;
}

.points-card{
    background:#fff;
    border-radius:28px;
    padding:26px;
    margin:-30px 18px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.points-title{

    color:#777;

    font-size:15px;

}

.points{
    font-size:58px;
    font-weight:800;
    line-height:1;
    letter-spacing:-2px;
    color:#222;
}

.member{

    display:inline-block;

    margin-top:16px;

    background:#FFF3CC;

    color:#B98500;

    padding:8px 16px;

    border-radius:50px;

    font-size:14px;

    font-weight:700;

}
    /* 搜索框 */

.search{

    margin-top:20px;

}

.search input{

    width:100%;

    height:52px;

    border:none;

    border-radius:18px;

    background:white;

    padding:0 18px;

    font-size:15px;

    box-shadow:var(--shadow);

    outline:none;

}

/* 分类 */

.categories{

    display:flex;

    gap:12px;

    overflow-x:auto;

    margin:22px 0;

    padding-bottom:4px;

}

.categories::-webkit-scrollbar{

    display:none;

}

.category{

    flex:none;

    border:none;

    background:white;

    padding:12px 22px;

    border-radius:999px;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    box-shadow:var(--shadow);

    color:#4d4d4d;

}

.category.active{

    background:var(--blue);

    color:white;

}

/* 商品 */

.products{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:18px;

}

.product{

    background:white;

    border-radius:22px;

    overflow:hidden;

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:.25s;

}

.product:hover{

    transform:translateY(-3px);

}

.product img{

    width:100%;

    aspect-ratio:1;

    object-fit:cover;

    display:block;

}

.product-info{

    padding:15px;

}

.product-title{

    font-size:16px;

    font-weight:700;

    margin-bottom:8px;

}

.product-points{

    color:#49a6e8;

    font-size:15px;

    font-weight:700;

}

.badge{

    display:inline-block;

    margin-top:10px;

    padding:4px 10px;

    border-radius:999px;

    background:#FFE27A;

    font-size:12px;

    font-weight:700;

}
</style>
</head>

<body>

<header class="header">
    <h1>Tienda</h1>
    <p>Canjea puntos o compra productos Paaani.</p>
</header>

<div class="container">

<div class="points-card">

<div class="points-title">
Mis puntos
</div>

<div class="points">
1280 Points
</div>

<div class="member">
⭐ Gold Member
</div>

<div class="search">
<input placeholder="Buscar productos...">
</div>

</div>

<div class="categories">

<button class="category active">Todos</button>

<button class="category">🎟 Cupones</button>

<button class="category">☕ Bebidas</button>

<button class="category">🍰 Postres</button>

<button class="category">🐶 Merch</button>

<button class="category">⭐ Nuevo</button>

</div>

<div class="products" id="products">
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a>

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a>

 <!-- 商城 -->
<a href="shop.html" class="nav-item active">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a>

</nav>

<style>

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}

/* 防止页面内容被底栏挡住 */
body {
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
}

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 50px rgba(0,0,0,.08);
      }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);
</script>
    <script>

async function loadProducts() {

    const { data, error } = await supabase
        .from("shop_products")
        .select("*")
        .eq("active", true);

    console.log(error);
    console.log(data);

    if (error) {
    alert(error.message);
    return;
}


    const container = document.getElementById("products");

    container.innerHTML = "";

    data.forEach(product => {

        container.innerHTML += `
           <div class="product">

    <img src="${product.image}" alt="${product.name}">

    <div class="product-info">

        <div class="product-title">
            ${product.name}
        </div>

        <div class="product-points">
            ⭐ ${product.points} Points
        </div>

        <div class="badge">
            ${product.badge ?? ""}
        </div>

    </div>

</div>
        `;

    });

}

loadProducts();


</script>
</body>
</html>
