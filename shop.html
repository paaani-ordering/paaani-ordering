<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda | Paaani Café</title>

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#FFE59A;
    --bg:#F7F7F7;
    --text:#222;
    --gray:#777;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    padding-bottom:90px;
}

.header{
    background:var(--blue);
    color:white;
    padding:46px 24px 30px;
}

.header h1{
    font-size:42px;
    font-weight:800;
}

.header p{
    margin-top:10px;
    opacity:.9;
}

.container{
    padding:20px;
}

.points-card{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.points-title{
    color:#666;
    font-size:14px;
}

.points{
    font-size:36px;
    font-weight:bold;
    margin-top:8px;
}

.member{
    display:inline-block;
    margin-top:12px;
    background:#FFF5CF;
    color:#C69200;
    padding:6px 14px;
    border-radius:100px;
    font-size:13px;
}

.search{
    margin-top:18px;
}

.search input{
    width:100%;
    height:48px;
    border:none;
    border-radius:14px;
    padding:0 16px;
    font-size:15px;
}

.category{
    margin-top:22px;
    display:flex;
    gap:10px;
    overflow:auto;
    padding-bottom:4px;
}

.category button{
    border:none;
    background:white;
    padding:10px 18px;
    border-radius:999px;
    white-space:nowrap;
    font-size:14px;
}

.category .active{
    background:var(--blue);
    color:white;
}

.products{
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.product{
    background:white;
    border-radius:20px;
    padding:16px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.product img{
    width:100%;
    border-radius:16px;
}

.product h3{
    margin-top:12px;
    font-size:16px;
}

.price{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.points-price{
    color:#FF9800;
    margin-top:6px;
    font-size:14px;
}

.buy{
    margin-top:14px;
    width:100%;
    height:42px;
    border:none;
    border-radius:12px;
    background:#8ED8F8;
    color:white;
    font-weight:bold;
}

.exchange{
    margin-top:8px;
    width:100%;
    height:42px;
    border:none;
    border-radius:12px;
    background:#FFE59A;
    color:#333;
    font-weight:bold;
}
 /* =========================
   底部导航
========================= */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

</style>
</head>

<body>

<header class="header">
    <h1>Tienda</h1>
    <p>Canjea puntos o compra productos Paaani.</p>
</header>

<div class="container">

<div class="points-card">

<div class="points-title">
Mis puntos
</div>

<div class="points">
1280 Points
</div>

<div class="member">
⭐ Gold Member
</div>

<div class="search">
<input placeholder="Buscar productos...">
</div>

</div>

<div class="category">

<button class="active">Todos</button>

<button>🎟 Cupones</button>

<button>☕ Bebidas</button>

<button>🍰 Postres</button>

<button>🐶 Merch</button>

<button>⭐ Nuevo</button>

</div>

<div class="products" id="products">
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a >

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a >

 <!-- 商城 -->
<a href="shop.html" class="nav-item active">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a >

</nav>

<style>

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -4px 15px rgba(0,0,0,.08);
}

.nav-item{
    text-decoration:none;
    color:#888;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-size:12px;
}

.nav-item span{
    font-size:22px;
    margin-bottom:4px;
}

.nav-item.active{
    color:#58C6F7;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);
</script>
    <script>

async function loadProducts() {

    const { data, error } = await supabase
        .from("shop_products")
        .select("*")
        .eq("active", true);

    if (error) {
    alert(error.message);
    return;
}

alert(JSON.stringify(data));

    const container = document.getElementById("products");

    container.innerHTML = "";

    data.forEach(product => {

        container.innerHTML += `
            <div class="product">

                <img src="${product.image}" alt="${product.name}">

                <h3>${product.name}</h3>

                <div class="price">
                    €${product.price}
                </div>

                <div class="points-price">
                    🌑 ${product.points} Points
                </div>

                <button class="exchange">
                    Canjear
                </button>

                <button class="buy">
                    Comprar
                </button>

            </div>
        `;

    });

}

loadProducts();

loadProducts();

</script>
</body>
</html>
