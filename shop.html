<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda | Paaani Café</title>

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#FFE59A;
    --bg:#F7F7F7;
    --text:#222;
    --gray:#777;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    padding-bottom:90px;
}

.header{
    background:var(--blue);
    color:white;
    padding:46px 24px 30px;
}

.header h1{
    font-size:42px;
    font-weight:800;
}

.header p{
    margin-top:10px;
    opacity:.9;
}

.container{
    padding:20px;
}

.points-card{
    background:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.points-title{
    color:#666;
    font-size:14px;
}

.points{
    font-size:36px;
    font-weight:bold;
    margin-top:8px;
}

.member{
    display:inline-block;
    margin-top:12px;
    background:#FFF5CF;
    color:#C69200;
    padding:6px 14px;
    border-radius:100px;
    font-size:13px;
}

.search{
    margin-top:18px;
}

.search input{
    width:100%;
    height:48px;
    border:none;
    border-radius:14px;
    padding:0 16px;
    font-size:15px;
}

.category{
    margin-top:22px;
    display:flex;
    gap:10px;
    overflow:auto;
    padding-bottom:4px;
}

.category button{
    border:none;
    background:white;
    padding:10px 18px;
    border-radius:999px;
    white-space:nowrap;
    font-size:14px;
}

.category .active{
    background:var(--blue);
    color:white;
}

.products{
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.product{
    background:white;
    border-radius:20px;
    padding:16px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.product img{
    width:100%;
    border-radius:16px;
}

.product h3{
    margin-top:12px;
    font-size:16px;
}

.price{
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.points-price{
    color:#FF9800;
    margin-top:6px;
    font-size:14px;
}

.buy{
    margin-top:14px;
    width:100%;
    height:42px;
    border:none;
    border-radius:12px;
    background:#8ED8F8;
    color:white;
    font-weight:bold;
}

.exchange{
    margin-top:8px;
    width:100%;
    height:42px;
    border:none;
    border-radius:12px;
    background:#FFE59A;
    color:#333;
    font-weight:bold;
}

</style>
</head>

<body>

<header class="header">
    <h1>Tienda</h1>
    <p>Canjea puntos o compra productos Paaani.</p>
</header>

<div class="container">

<div class="points-card">

<div class="points-title">
Mis puntos
</div>

<div class="points">
1280 Points
</div>

<div class="member">
⭐ Gold Member
</div>

<div class="search">
<input placeholder="Buscar productos...">
</div>

</div>

<div class="category">

<button class="active">Todos</button>

<button>🎟 Cupones</button>

<button>☕ Bebidas</button>

<button>🍰 Postres</button>

<button>🐶 Merch</button>

<button>⭐ Nuevo</button>

</div>

<div class="products">
