<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Mi pedido | Paaani Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #8ed8f8;
      --yellow: #FFEAAB;
      --bg: #f7f7f5;
      --text: #222222;
      --gray: #888888;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);

      padding-bottom: calc(95px + env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
    }


    /* ===== 顶部 ===== */

    .header {
      background: #ffffff;
      padding: 24px 20px 18px;
      border-bottom: 1px solid #eeeeee;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--gray);
      font-size: 14px;
    }


    /* ===== 订单内容 ===== */

    .content {
      padding: 18px 16px 30px;
    }


    /* ===== 堂食 / 外带 ===== */

    .order-type-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 17px 18px;
      margin-bottom: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-type-label {
      font-size: 14px;
      color: #888;
    }

    .order-type-value {
      color: var(--blue);
      font-size: 15px;
      font-weight: 700;
    }


    /* ===== 标题 ===== */

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 24px 2px 14px;
    }


    /* ===== 商品 ===== */

    .order-item {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;

      display: flex;
      gap: 13px;
      align-items: center;
    }

    .order-item img {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 13px;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .item-options {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
      margin-bottom: 9px;
    }

    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-price {
      font-size: 16px;
      font-weight: 800;
    }


    /* ===== 数量 ===== */

    .quantity {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .minus {
      background: #f1f1f1;
      color: #555;
    }

    .plus {
      background: var(--yellow);
      color: #168ad0;
    }

    .quantity-number {
      min-width: 15px;
      text-align: center;
      font-weight: 700;
    }


    /* ===== 空订单 ===== */

    .empty-cart {
      display: none;
      background: #ffffff;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 14px;
    }

    .empty-cart h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .empty-cart p {
      margin: 0;
      color: #999;
      font-size: 14px;
    }


    /* ===== 金额 ===== */

    .summary {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      margin-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: #777;
    }

    .summary-row:last-child {
      margin-bottom: 0;
    }

    .summary-total {
      border-top: 1px solid #eeeeee;
      padding-top: 15px;
      margin-top: 14px;

      color: #222;
      font-size: 18px;
      font-weight: 800;
    }


    /* ===== 按钮 ===== */

    .continue-btn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;

      border: none;
      border-radius: 16px;

      background: var(--blue);
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }


    /* ===== 底部导航 ===== */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);

      width: 100%;
      max-width: 600px;
      height: 72px;

      background: #ffffff;
      border-top: 1px solid #eeeeee;

      display: flex;
      justify-content: space-around;
      align-items: center;

      padding-bottom: env(safe-area-inset-bottom);

      z-index: 9999;
    }

    .nav-item {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 4px;

      text-decoration: none;
      color: #8c8c88;

      font-size: 11px;
      font-weight: 600;

      -webkit-tap-highlight-color: transparent;
    }

    .nav-icon {
      width: 23px;
      height: 23px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon svg {
      width: 23px;
      height: 23px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active {
      color: var(--blue);
      font-weight: 700;
    }

  </style>
</head>


<body>

<div class="app">

  <!-- 顶部 -->
  <header class="header">
    <h1>Mi pedido</h1>
    <p>Revisa tu pedido antes de continuar</p>
  </header>


  <main class="content">

    <!-- 堂食 / 外带 -->
    <div class="order-type-box">
      <span class="order-type-label">Tipo de pedido</span>
      <strong class="order-type-value" id="orderTypeDisplay">
        Comer aquí
      </strong>
    </div>


    <div class="section-title">
      Tu pedido
    </div>


    <!-- 商品会自动放进这里 -->
    <div id="orderItems"></div>


    <!-- 空订单 -->
    <div class="empty-cart" id="emptyCart">

      <div class="empty-icon">🛒</div>

      <h2>Tu pedido está vacío</h2>

      <p>
        Añade algo rico del menú.
      </p>

    </div>


    <!-- 金额 -->
    <div class="summary" id="summary">

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">0,00 €</span>
      </div>

      <div class="summary-row summary-total">
        <span>Total</span>
        <span id="total">0,00 €</span>
      </div>

    </div>


    <button
      class="continue-btn"
      onclick="window.location.href='menu.html'"
    >
      + Seguir pidiendo
    </button>

  </main>

</div>


<!-- ===== 底部导航 ===== -->

<nav class="bottom-nav">

  <a href="index.html" class="nav-item">

    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9H15v-6H9v6H3z"/>
      </svg>
    </span>

    <span>Inicio</span>

  </a>


  <a href="menu.html" class="nav-item">

    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 6h14M5 12h14M5 18h14"/>
      </svg>
    </span>

    <span>Menú</span>

  </a>


  <a href="orders.html" class="nav-item active">

    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>
        <path d="M9 8h6M9 12h6"/>
      </svg>
    </span>

    <span>Pedidos</span>

  </a>


  <a href="account.html" class="nav-item">

    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>

    <span>Mi cuenta</span>

  </a>

</nav>


<script>

let cart = JSON.parse(
  localStorage.getItem('paaaniCart') || '{}'
);


// =========================
// 价格格式
// =========================

function formatPrice(price) {

  return `${Number(price)
    .toFixed(2)
    .replace('.', ',')} €`;
}


// =========================
// 显示订单
// =========================

function renderOrder() {

  const orderItems =
    document.getElementById('orderItems');

  const emptyCart =
    document.getElementById('emptyCart');

  const summary =
    document.getElementById('summary');

  const products =
    Object.values(cart);


  orderItems.innerHTML = '';


  // 没有商品
  if (products.length === 0) {

    emptyCart.style.display = 'block';
    summary.style.display = 'none';

    return;
  }


  emptyCart.style.display = 'none';
  summary.style.display = 'block';


  let subtotal = 0;


  products.forEach(product => {

    const quantity =
      Number(product.quantity || 1);

    const price =
      Number(product.price || 0);

    subtotal += price * quantity;


    const item =
      document.createElement('div');

    item.className = 'order-item';


    item.innerHTML = `

      ${
        product.image_url
          ? `
            <img
              src="${product.image_url}"
              alt="${product.name}"
            >
          `
          : ''
      }


      <div class="item-info">

        <div class="item-name">
          ${product.name}
        </div>


        ${
          product.optionName
            ? `
              <div class="item-options">
                ${
                  product.groupName
                    ? product.groupName + ': '
                    : ''
                }
                ${product.optionName}
              </div>
            `
            : ''
        }


        <div class="item-bottom">

          <div class="item-price">
            ${formatPrice(price * quantity)}
          </div>


          <div class="quantity">

            <button
              class="minus"
              onclick="changeQuantity(
                '${product.cartKey}',
                -1
              )"
            >
              −
            </button>


            <span class="quantity-number">
              ${quantity}
            </span>


            <button
              class="plus"
              onclick="changeQuantity(
                '${product.cartKey}',
                1
              )"
            >
              +
            </button>

          </div>

        </div>

      </div>

    `;


    orderItems.appendChild(item);

  });


  document
    .getElementById('subtotal')
    .textContent =
      formatPrice(subtotal);


  document
    .getElementById('total')
    .textContent =
      formatPrice(subtotal);

}


// =========================
// 修改数量
// =========================

function changeQuantity(cartKey, amount) {

  if (!cart[cartKey]) return;


  cart[cartKey].quantity += amount;


  // 数量变成 0 就删除
  if (cart[cartKey].quantity <= 0) {

    delete cart[cartKey];

  }


  // 保存
  localStorage.setItem(
    'paaaniCart',
    JSON.stringify(cart)
  );


  // 重新显示
  renderOrder();

}


// =========================
// 堂食 / 外带
// =========================

const orderType =
  localStorage.getItem('orderType');


const orderTypeDisplay =
  document.getElementById('orderTypeDisplay');


if (orderTypeDisplay) {

  orderTypeDisplay.textContent =
    orderType || 'Comer aquí';

}


// =========================
// 页面打开
// =========================

renderOrder();

</script>

</body>
</html>
