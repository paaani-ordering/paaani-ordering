<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tienda | Paaani Café</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#FFFFFF;
    --shadow:0 10px 30px rgba(0,0,0,.08);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

body{
    background:#f7f9fc;
    color:var(--text);
    padding-bottom:90px;
}

.container{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:20px;
}

.points-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.points-title{
    font-size:15px;
    color:#888;
}

.points-number{
    font-size:72px;
    font-weight:800;
    line-height:1;
}

.points-label{
    color:#999;
    margin-top:6px;
}

.member-card{
    width:220px;
    height:130px;
    border-radius:20px;
    padding:16px;
    color:white;
    background:linear-gradient(135deg,#8ED8F8,#BFEFFF);
    position:relative;
}

.card-top{
    display:flex;
    align-items:center;
}

.card-logo{
    width:42px;
    height:42px;
}

.card-info{
    margin-left:10px;
}

.card-name{
    font-weight:700;
}

.card-level{
    font-size:12px;
}

.card-points{
    margin-top:18px;
    font-size:22px;
    font-weight:bold;
}

.card-qr{
    position:absolute;
    width:42px;
    right:16px;
    bottom:16px;
}
/* ========= Check-in ========= */

.checkin-card{
    margin-top:22px;
    background:#fff;
    border-radius:22px;
    padding:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.checkin-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.checkin-title{
    font-size:17px;
    font-weight:700;
}

.checkin-desc{
    margin-top:5px;
    color:#999;
    font-size:13px;
}

.checkin-btn{
    width:130px;
    height:42px;
    border:none;
    border-radius:999px;
    background:#8ED8F8;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.checkin-btn:disabled{
    opacity:.7;
}

.checkin-days{
    display:flex;
    gap:14px;
    margin-top:16px;
}

.checkin-days span{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#F5F5F5;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

.checkin-days span.active{
    background:#8ED8F8;
    color:#fff;
}

.checkin-days .gift{
    background:#FFE58F;
}

/* ========= Category ========= */

.categories{
    display:flex;
    gap:26px;
    margin:24px 0;
    border-bottom:1px solid #eee;
}

.category{
    background:none;
    border:none;
    padding-bottom:10px;
    font-size:15px;
    font-weight:700;
    color:#999;
    cursor:pointer;
}

.category.active{
    color:#222;
    border-bottom:3px solid #8ED8F8;
}

/* ========= Products ========= */

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.product{
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.06);
}

.product img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
}

.product-info{
    padding:14px;
}

.product-title{
    font-weight:700;
    margin-bottom:8px;
}

.product-points{
    color:#4AA7E8;
    font-weight:700;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:4px 10px;
    border-radius:999px;
    background:#FFE27A;
    font-size:12px;
    font-weight:700;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    background:#fff;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-around;
    align-items:center;
}
</style>
</head>

<body>

<div class="container">

    <div class="points-header">

        <div class="points-left">

            <div class="points-title">
                Puntos actuales
            </div>

            <div class="points-number" id="pointsNumber">
                0
            </div>

            <div class="points-label">
                Points
            </div>

        </div>

        <div class="member-card">

            <div class="card-top">

                <img
                    src="images/pani.png"
                    class="card-logo"
                    alt="PAAANI Logo"
                >

                <div class="card-info">

                    <div class="card-name">
                        PAAANI
                    </div>

                    <div class="card-level">
                        VIP MEMBER
                    </div>

                </div>

            </div>

            <div class="card-points">

                <span id="cardPoints">
                    0
                </span>

                Points

            </div>

            <img
                src="images/qrcode.png"
                class="card-qr"
                alt="QR Code"
            >

        </div>

    </div>

    <div class="checkin-card">

        <div class="checkin-top">

            <div>

                <div class="checkin-title">
                    Registro diario
                </div>

                <div class="checkin-desc">
                    Haz check-in hoy y gana +5 puntos
                </div>

            </div>

            <button
                id="checkinBtn"
                class="checkin-btn">

                Check in

            </button>

        </div>

        <div class="checkin-days">

            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>

            <span class="gift">
                🎁
            </span>

        </div>

    </div>

    <div class="categories">

        <button class="category active">
            Todos
        </button>

        <button class="category">
            🎟 Cupones
        </button>

        <button class="category">
            🐶 Merch
        </button>

    </div>

    <div
        id="products"
        class="products">
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// =======================
// Supabase
// =======================

const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";
const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

// 你的 members 表 id
const memberId = "63a972d5-ab25-43a6-99a6-a1453c6aeae7";


// =======================
// 页面变量
// =======================

let points = 0;
let checkDays = 0;
let lastDate = null;

const pointsNumber = document.getElementById("pointsNumber");
const cardPoints = document.getElementById("cardPoints");

const btn = document.getElementById("checkinBtn");
const desc = document.querySelector(".checkin-desc");
const days = document.querySelectorAll(".checkin-days span:not(.gift)");

const today = new Date().toISOString().split("T")[0];

const yesterday = new Date();
yesterday.setDate(yesterday.getDate()-1);
const yesterdayStr = yesterday.toISOString().split("T")[0];


// =======================
// 显示积分
// =======================

function renderPoints(){

    pointsNumber.innerText = points;
    cardPoints.innerText = points;

}


// =======================
// 显示签到
// =======================

function renderCheckin(){

    days.forEach((item,index)=>{

        if(index < checkDays){

            item.classList.add("active");
            item.innerHTML="✓";

        }else{

            item.classList.remove("active");
            item.innerHTML=index+1;

        }

    });

    if(lastDate===today){

        btn.disabled=true;
        btn.innerHTML="✓ Completado";

        desc.innerHTML=
        `Has hecho check-in durante ${checkDays} día${checkDays==1?"":"s"} consecutivo${checkDays==1?"":"s"}`;

    }else{

        btn.disabled=false;
        btn.innerHTML="Check in";

        desc.innerHTML=
        "Haz check-in hoy y gana +5 puntos";

    }

}
// =======================
// 读取会员资料
// =======================

async function loadMember(){

    const { data, error } = await supabase
        .from("members")
        .select("*")
        .eq("id", memberId)
        .single();

    if(error){
        console.error(error);
        return;
    }

    points = data.points ?? 0;
    checkDays = data.check_days ?? 0;
    lastDate = data.last_checkin ?? null;

    renderPoints();
    renderCheckin();

}


// =======================
// 读取商品
// =======================

async function loadProducts(){

    const { data, error } = await supabase
        .from("shop_products")
        .select("*")
        .eq("active", true);

    if(error){
        console.error(error);
        return;
    }

    const container = document.getElementById("products");

    container.innerHTML = "";

    data.forEach(product=>{

        container.innerHTML += `
        <div class="product">

            <img
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <div class="product-title">
                    ${product.name}
                </div>

                <div class="product-points">
                    ⭐ ${product.points} Points
                </div>

                ${
                    product.badge
                    ? `<div class="badge">${product.badge}</div>`
                    : ""
                }

            </div>

        </div>
        `;

    });

}


// =======================
// 点击签到
// =======================

btn.addEventListener("click", async ()=>{

    if(lastDate===today) return;

    if(lastDate===yesterdayStr){

        checkDays++;

    }else{

        checkDays=1;

    }

    points += 5;

    if(checkDays>=7){

        points += 20;

        checkDays=0;

        alert("🎉 ¡Has conseguido el premio semanal!");

    }

    const { error } = await supabase
        .from("members")
        .update({

            points:points,
            check_days:checkDays,
            last_checkin:today

        })
        .eq("id",memberId);

    if(error){

        console.error(error);
        alert("Error al guardar.");

        return;

    }

    lastDate=today;

    renderPoints();
    renderCheckin();

});
 // =======================
// 页面初始化
// =======================

window.addEventListener("load", async () => {

    await loadMember();
    await loadProducts();

});

</script>

</body>
</html>
