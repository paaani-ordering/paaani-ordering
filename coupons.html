<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupones | Paaani</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f8f5;
      font-family: Arial, sans-serif;
      color: #222;
      padding-bottom: calc(95px + env(safe-area-inset-bottom));
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* 顶部 */
    .header {
      background: #8ed8f8;
      padding: 22px 20px 28px;
      color: white;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 28px;
      line-height: 1;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 10px 0 0 42px;
      font-size: 13px;
      opacity: .9;
    }

    /* 内容 */
    .content {
      padding: 22px 18px;
    }

    .section-title {
      margin: 0 0 15px 3px;
      font-size: 18px;
    }

    .my-title {
      margin-top: 32px;
    }

    /* 优惠券 */
    .coupon {
      background: white;
      border-radius: 20px;
      margin-bottom: 16px;
      overflow: hidden;
      display: flex;
      min-height: 130px;
      box-shadow: 0 3px 14px rgba(0,0,0,.035);
    }

    .coupon-value {
      width: 105px;
      flex-shrink: 0;
      background: #FFEAAB;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #333;
      text-align: center;
    }

    .coupon-value strong {
      font-size: 27px;
      line-height: 1;
    }

    .coupon-value span {
      font-size: 11px;
      margin-top: 7px;
    }

    .coupon-info {
      flex: 1;
      padding: 17px 16px;
      display: flex;
      flex-direction: column;
    }

    .coupon-info h3 {
      margin: 0 0 7px;
      font-size: 16px;
    }

    .coupon-info p {
      margin: 0;
      color: #777;
      font-size: 12px;
      line-height: 1.45;
    }

    .coupon-bottom {
      margin-top: auto;
      padding-top: 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .expiry {
      font-size: 10px;
      color: #aaa;
    }

    .claim-btn {
      border: 0;
      background: #8ed8f8;
      color: white;

      padding: 8px 14px;
      border-radius: 20px;

      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .claim-btn:disabled {
      background: #d4d4d4;
      cursor: default;
    }

    .status {
      color: #999;
      font-size: 12px;
      padding: 8px 3px 18px;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 20px;
      color: #999;
      font-size: 13px;
      text-align: center;
      margin-bottom: 18px;
    }

       /* =========================
   底部导航
========================= */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}

/* 防止页面内容被底栏挡住 */
body {
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
}

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 50px rgba(0,0,0,.08);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="header-top">
      <a href="index.html" class="back">‹</a>
      <h1>Cupones</h1>
    </div>

    <p>Descubre las ofertas disponibles</p>

  </header>


  <main class="content">

    <!-- 可以领取 -->
    <h2 class="section-title">Disponibles</h2>

    <div id="available-coupons">
      <div class="status">Cargando cupones...</div>
    </div>


    <!-- 已经领取 -->
    <h2 class="section-title my-title">Mis cupones</h2>

    <div id="my-coupons">
      <div class="status">Cargando tus cupones...</div>
    </div>

  </main>

</div>


<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a >

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a >

 <!-- 商城 -->
<a href="shop2.html" class="nav-item">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a >

</nav>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ==========================================
     把这里换成你项目现有的两个值
     ========================================== */

  const SUPABASE_URL = "https://oevwuadmtzujngtmkkbw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

  const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  const availableBox =
    document.getElementById("available-coupons");

  const myBox =
    document.getElementById("my-coupons");


  let currentUser = null;
  let claimedCouponIds = new Set();


  /* 日期显示 */

  function formatDate(value) {

    if (!value) return "";

    const date = new Date(value);

    return date.toLocaleDateString(
      "es-ES",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );
  }


  /* 优惠额度 */

  function couponValue(coupon) {

    if (coupon.discount_type === "percent") {

      return `
        <strong>${coupon.discount_value}%</strong>
        <span>DESCUENTO</span>
      `;

    }

    if (
      coupon.discount_type === "fixed" ||
      coupon.discount_type === "amount"
    ) {

      return `
        <strong>${coupon.discount_value}€</strong>
        <span>DESCUENTO</span>
      `;

    }

    return `
      <strong>★</strong>
      <span>OFERTA</span>
    `;
  }


  /* 生成优惠券 */

  function couponHTML(coupon, claimed = false) {

    let expiry = "";

    if (claimed && coupon.expires_at) {

      expiry =
        `Hasta ${formatDate(coupon.expires_at)}`;

    } else if (coupon.end_at) {

      expiry =
        `Hasta ${formatDate(coupon.end_at)}`;

    }


    return `
      <div class="coupon">

        <div class="coupon-value">
          ${couponValue(coupon)}
        </div>

        <div class="coupon-info">

          <h3>
            ${coupon.title || "Cupón Paaani"}
          </h3>

          <p>
            ${coupon.description || ""}
          </p>

          <div class="coupon-bottom">

            <span class="expiry">
              ${expiry}
            </span>

            ${
              claimed

              ? `
                <button
                  class="claim-btn"
                  disabled
                >
                  Conseguido
                </button>
              `

              : `
                <button
                  class="claim-btn"
                  onclick="claimCoupon(${coupon.id}, this)"
                >
                  Conseguir
                </button>
              `
            }

          </div>

        </div>

      </div>
    `;
  }


  /* 读取登录用户 */

  async function getUser() {

    const {
      data,
      error
    } = await sb.auth.getUser();

    if (error) {
      console.error(error);
    }

    currentUser = data?.user || null;

  }


  /* 读取已经领取的优惠券 */

  async function loadMyCoupons() {

    if (!currentUser) {

      myBox.innerHTML = `
        <div class="empty">
          Inicia sesión para ver tus cupones.
        </div>
      `;

      return;
    }


    const {
      data,
      error
    } = await sb

      .from("user_coupons")

      .select(`
        coupon_id,
        claimed_at,
        expires_at,
        coupons (
          id,
          title,
          description,
          discount_type,
          discount_value,
          end_at
        )
      `)

      .eq(
        "user_id",
        currentUser.id
      )

      .order(
        "claimed_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "读取我的优惠券失败:",
        error
      );

      myBox.innerHTML = `
        <div class="empty">
          No se pudieron cargar tus cupones.
        </div>
      `;

      return;
    }


    claimedCouponIds =
      new Set(
        (data || []).map(
          item => item.coupon_id
        )
      );


    if (!data || data.length === 0) {

      myBox.innerHTML = `
        <div class="empty">
          Todavía no tienes cupones.
        </div>
      `;

      return;
    }


    myBox.innerHTML =
      data

        .filter(item => item.coupons)

        .map(item => {

          const coupon = {
            ...item.coupons,
            expires_at: item.expires_at
          };

          return couponHTML(
            coupon,
            true
          );

        })

        .join("");

  }


  /* 读取现在有效的优惠券 */

  async function loadAvailableCoupons() {

    const now =
      new Date().toISOString();


    const {
      data,
      error
    } = await sb

      .from("coupons")

      .select("*")

      .eq("is_active", true)
      
      .eq("is_public", true)

      .or(
        `start_at.is.null,start_at.lte.${now}`
      )

      .or(
        `end_at.is.null,end_at.gte.${now}`
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "读取优惠券失败:",
        error
      );

      availableBox.innerHTML = `
        <div class="empty">
          No se pudieron cargar los cupones.
        </div>
      `;

      return;
    }


    const available =
      (data || []).filter(
        coupon =>
          !claimedCouponIds.has(coupon.id)
      );


    if (available.length === 0) {

      availableBox.innerHTML = `
        <div class="empty">
          No hay nuevos cupones disponibles.
        </div>
      `;

      return;
    }


    availableBox.innerHTML =
      available
        .map(coupon =>
          couponHTML(coupon, false)
        )
        .join("");

  }


  /* 领取 */

  async function claimCoupon(
    couponId,
    button
  ) {

    if (!currentUser) {

      alert(
        "Inicia sesión para conseguir este cupón."
      );

      return;
    }


    button.disabled = true;
    button.textContent = "Guardando...";


    const {
      error
    } = await sb

      .from("user_coupons")

      .insert({
        user_id: currentUser.id,
        coupon_id: couponId
      });


    if (error) {

      console.error(
        "领取优惠券失败:",
        error
      );


      if (
        error.code === "23505"
      ) {

        alert(
          "Ya tienes este cupón."
        );

      } else {

        alert(
          "No se pudo conseguir el cupón."
        );

      }


      button.disabled = false;
      button.textContent = "Conseguir";

      return;
    }


    await refreshCoupons();

  }


  /* 刷新 */

  async function refreshCoupons() {

    await loadMyCoupons();
    await loadAvailableCoupons();

  }


  /* 页面启动 */

  async function init() {

    await getUser();
    await refreshCoupons();

  }


  init();

</script>

</body>
</html>
