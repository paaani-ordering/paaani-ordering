<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda | Paaani</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#ffffff;
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    max-width:430px;
    margin:0 auto;

    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}
a{

    text-decoration:none;
    color:inherit;

}

/*================ HEADER ================*/

.header{

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.greeting{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.shop-title{

    font-size:34px;

    font-weight:800;

    color:#2B2B2B;

}

.points-card{

    width:74px;

    height:74px;

    border-radius:22px;

    background:#8ED8F8;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#fff;

    box-shadow:0 12px 30px rgba(142,216,248,.35);

}

.points-num{

    font-size:26px;

    font-weight:800;

    line-height:1;

}

.points-text{

    margin-top:2px;

    font-size:13px;

    font-weight:700;

}

main{

    padding:20px;

}

/* ---------- Check-in ---------- */

.checkin{
    background:#fff;
    border-radius:18px;
    padding:10px 14px;
    margin-top:-12px;
    margin-bottom:4px;
}
.check-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.check-title{
    font-size:15px;
    margin-bottom:2px;
    font-weight:800;
}

.check-sub{
    margin-top:6px;
    font-size:14px;
    color:#8A8A8A;
}
.check-desc{
    font-size:12px;
    line-height:1.2;
    margin-bottom:6px;
}

.check-days{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:14px 0 12px;
}
.day{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #E8E8E8;
    background:#fff;
    color:#999;
    font-size:15px;
    font-weight:700;
    flex-shrink:0;
    transition:.25s;
}

.day.done{
    background:#8ED8F8;
    border-color:#8ED8F8;
    color:#fff;
}

.day.today{
    background:#F7D86B;
    border-color:#F7D86B;
    color:#333;
    transform:scale(1.18);
    box-shadow:0 6px 15px rgba(247,216,107,.45);
}

.day.gift{
    background:#FFF7D8;
    border-color:#FFF7D8;
    font-size:18px;
}

.line{
    width:12px;
    height:2px;
    background:#ECECEC;
    border-radius:999px;
}

.line.done{
    background:#8ED8F8;
}

.reward{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
}

.reward-left{
    display:flex;
    flex-direction:column;
}

.reward-points{
    font-size:13px;
    font-weight:800;
    color:#21B15C;
    line-height:1;
    margin-top:4px;
}

.check-btn{
    min-width:118px;
    height:30px;
    border:none;
    border-radius:17px;
    background:#8ED8F8;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(142,216,248,.35);
    transition:.2s;
}

.check-btn:hover{
    transform:translateY(-2px);
}

.check-btn:active{
    transform:scale(.96);
}

.check-status{
    font-size:12px;
    font-weight:700;
    color:#666;
    line-height:1;
}

/* ---------- 分类 ---------- */

.tabs{
    display:flex;
    gap:10px;
    margin:10px 0 10px;
}

.tab{
    flex:1;

    height:36px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff;
    border-radius:18px;

    font-size:13px;
    font-weight:700;
    color:#333;

    box-shadow:0 4px 12px rgba(0,0,0,.04);

    cursor:pointer;
}
.tab.active{
    background:var(--blue);
    color:#fff;
}

/* ---------- 商品 ---------- */

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
    padding:0 16px 16px;
    margin-top:24px;
}
    
.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
    transition:.25s;
    width:100%;
    box-sizing:border-box;
}

.card:active{
    transform:scale(.98);
}
.product-image{
    width:90%;
    aspect-ratio:1/1;
    object-fit:contain;
    padding:2px;
    margin:0 auto;
    display:block;
}
.info{
    padding:6px 12px;
}

.name{
    font-size:12px;
    line-height:1.25;
    font-weight:700;
    color:#6395D9;
    text-align:center;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;

    min-height:16px;
}

.description{
    margin-top:2px;
    color:#666;
    font-size:12px;
    line-height:1.3;

    display:none;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    font-size:22px;
    line-height:1;
    font-weight:800;
}
.points{
    display:flex;
    align-items:center;
    justify-content:center;

    margin-top:20px auto 0;

    padding:2px 10px;

    background:#FFF4C8;
    color:#C18A00;

    border-radius:999px;

    font-size:13px;
    font-weight:700;
}

.price span{
    font-size:16px;
}

.exchange{

height:44px;

border-radius:14px;

font-size:16px;

font-weight:800;

background:#8ED8F8;

box-shadow:0 6px 16px rgba(142,216,248,.35);

}
.exchange:active{
    transform:scale(.97);
}
.bottom-space{

    height:78px;

}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}
.sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);

    display:none;
    align-items:flex-end;

    z-index:999;
}

.sheet{
    width:100%;
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:24px;
    padding-bottom:150px;
    animation:up .25s;
    max-height:90vh;
    overflow-y:auto;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.sheet-bar{
    width:42px;
    height:5px;
    background:#ddd;
    border-radius:999px;
    margin:auto;
    margin-bottom:20px;
}
    .sheet img{
    width:180px;
    height:180px;
    object-fit:contain;
    display:block;
    margin:10px auto 20px;
}

.sheet h2{
    text-align:center;
    font-size:22px;
    margin-bottom:14px;
}

.option{
    border:2px solid #eee;
    border-radius:18px;
    padding:16px;
    margin-top:12px;
    cursor:pointer;
    font-weight:700;
}

.option.active{
    border-color:#8ED8F8;
    background:#F3FBFF;
}

.continue-btn{
    width:100%;
    margin-top:24px;
    height:54px;
    border:none;
    border-radius:999px;
    background:#8ED8F8;
    color:#fff;
    font-size:17px;
    font-weight:800;
}
    #sheetGallery {
    width: 100%;
    margin-top: 18px;
}

#sheetGallery img {
    width: 85%;
    max-height:260px;
    display: block;
    margin:0 auto 12px;
    border-radius: 14px;
    object-fit:contain;
}
    .image-slider {
    display: flex;
    flex-direction: column;
    width: 100%;
    overflow: visible;
}
  .image-slider img {
    flex:none;
    width: 85%;
    min-width:0;
    max-width:85%;
    margin:0 auto 12px;
    height: auto;
    display: block;
    object-fit: contain;
    scroll-snap-align: start;
}

.image-slider::-webkit-scrollbar {
  display: none;
}

.image-slider img {
  flex: 0 0 100%;
  width: 100%;
  min-width: 100%;
  max-width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  scroll-snap-align: start;
  user-select: none;
  -webkit-user-drag: none;
}
    #sheetImage {
    display: none;
}
</style>
</head>

    </button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const productsContainer = document.querySelector(".products");

let currentType = "all";

loadProducts();
    async function loadProducts() {

    const { data, error } = await supabaseClient
        .from("shop_products")
        .select("*")
        .eq("active", true)
        .order("display_order");
window.products = data;
    if (error) {
        console.error(error);
        return;
    }
    productsContainer.innerHTML = "";

// 分类过滤
const list = data.filter(product => {

    if(currentType === "all") return true;

    return (product.category || "").toLowerCase() === currentType.toLowerCase();

});

list.forEach(product => {
        

  productsContainer.innerHTML += `
<div class="card" onclick="openProduct('${product.id}')">
<img
    class="product-image"
    src="${product.image}"
    alt="${product.name}"
>

<div class="info">

<div class="name">
${product.name}
</div>

<div class="description">
${product.description || ""}
</div>

<div class="points">
    ⭐ ${product.points} pts
</div>

</div>

</div>
`;
});
}
 const tabs = document.querySelectorAll(".tab");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));

        tab.classList.add("active");

        currentType = tab.dataset.type;

        loadProducts();

    });

}); 

  document.getElementById("productSheet")?.addEventListener("click", function(e){

    if(e.target === this){
        this.style.display = "none";
    }

});
    let buyType = "points";

document.querySelectorAll(".option").forEach(item=>{

    item.onclick=function(e){

        e.stopPropagation();

        document
            .querySelectorAll(".option")
            .forEach(x=>x.classList.remove("active"));

        this.classList.add("active");

        buyType=this.dataset.type;

    };

});
    let currentProduct = null;

function openProduct(id){

    currentProduct = window.products.find(x=>x.id==id);
    console.log("当前商品 images =", currentProduct.images);
    document.getElementById("sheetImage").src=currentProduct.image;
    const gallery = document.getElementById("sheetGallery");
gallery.innerHTML = "";

// 多图左右滑动
let images = [];

if (currentProduct.images && Array.isArray(currentProduct.images)) {
    images = currentProduct.images;
} else if (currentProduct.image) {
    images = [currentProduct.image];
}

// 去重 + 清理空地址
images = [...new Set(
    images.filter(img => img && img.trim())
)];

const slider = document.createElement("div");
slider.className = "image-slider";

slider.style.overflowX = "auto";
slider.style.overflowY = "hidden";
slider.style.touchAction = "pan-x";
slider.style.webkitOverflowScrolling = "touch";

let startX = 0;
let startScrollLeft = 0;

slider.addEventListener("touchstart", function(e) {
    startX = e.touches[0].pageX;
    startScrollLeft = slider.scrollLeft;
}, { passive: true });

slider.addEventListener("touchmove", function(e) {
    const x = e.touches[0].pageX;
    const distance = startX - x;
    slider.scrollLeft = startScrollLeft + distance;
}, { passive: true });    

images.forEach(img => {

    const image = document.createElement("img");

    image.src = String(img).trim();

    image.alt = currentProduct.name || "";

    image.loading = "eager";

    image.onerror = function () {
        console.error("图片加载失败:", this.src);
    };

    slider.appendChild(image);

});

gallery.appendChild(slider);
    
    document.getElementById("sheetName").innerText=currentProduct.name;
    document.getElementById("sheetPoints").innerText=
        "⭐ "+currentProduct.points+" pts";
    document.getElementById("sheetPrice").innerText=
        "€"+currentProduct.price;

    document.getElementById("productSheet").style.display="flex";
}

document.querySelector(".continue-btn")?.addEventListener("click", function(){

    location.href =
    `checkout.html?id=${currentProduct.id}&type=${buyType}`;

});
function updatePoints(points) {

    const pointsBox =
        document.getElementById("pointsNum");

    if (pointsBox) {
        pointsBox.textContent = String(points);
    }
}

function updateCheckinButton() {

    const button =
        document.getElementById("checkInBtn");

    if (!button) return;

    const today = new Date().toDateString();

    const lastCheckin =
        localStorage.getItem("paaniLastCheckin");

    let checkinDay =
        parseInt(
            localStorage.getItem("paaniCheckinDay")
        ) || 1;

    if (lastCheckin === today) {

        button.textContent = "✓ Checked in";
        button.disabled = true;

        button.style.opacity = "0.6";
        button.style.cursor = "default";

   } else if (checkinDay > 7) {

    checkinDay = 1;

    localStorage.setItem(
        "paaniCheckinDay",
        "1"
    );

    localStorage.removeItem(
        "paaniCheckinCompleted"
    );

    updateCheckinDays();

    button.textContent = "Check-in";
    button.disabled = false;

    button.style.opacity = "1";
    button.style.cursor = "pointer";

} else {

        button.textContent = "Check-in";
        button.disabled = false;

        button.style.opacity = "1";
        button.style.cursor = "pointer";
    }
}


function doCheckIn() {

    let checkinDay =
        parseInt(
            localStorage.getItem("paaniCheckinDay")
        ) || 1;

    let points =
        parseInt(
            localStorage.getItem("paaniPoints")
        ) || 0;

    const today = new Date().toDateString();

    const lastCheckin =
        localStorage.getItem("paaniLastCheckin");


    // =========================
    // 检查是否漏签
    // =========================

    if (lastCheckin) {

        const todayDate = new Date();
        const lastDate = new Date(lastCheckin);

        const todayOnly = new Date(
            todayDate.getFullYear(),
            todayDate.getMonth(),
            todayDate.getDate()
        );

        const lastOnly = new Date(
            lastDate.getFullYear(),
            lastDate.getMonth(),
            lastDate.getDate()
        );

        const diffDays =
            Math.round(
                (todayOnly - lastOnly) /
                (1000 * 60 * 60 * 24)
            );


        // 今天已经签到
        if (diffDays === 0) {

            updateCheckinButton();

            return;
        }


        // 漏了一天或更多 → 重新从第1天开始
        if (diffDays > 1) {

            checkinDay = 1;

            localStorage.setItem(
                "paaniCheckinDay",
                "1"
            );
        }
    }


    // =========================
    // 获得 5 积分
    // =========================

    points += 5;

    // 保存今天签到
    localStorage.setItem(
        "paaniLastCheckin",
        today
    );


    // =========================
    // 7天完成后开启新一轮
    // =========================

   if (checkinDay === 7) {

    localStorage.setItem(
        "paaniCheckinCompleted",
        "true"
    );

    localStorage.setItem(
        "paaniCheckinDay",
        "8"
    );

} else {
        // 正常进入下一天

        localStorage.setItem(
            "paaniCheckinDay",
            String(checkinDay + 1)
        );
    }


    // 保存积分
    localStorage.setItem(
        "paaniPoints",
        String(points)
    );


    // 更新页面
    updateCheckinDays();

   document.querySelectorAll(".points-num").forEach(function(el) {
    el.textContent = String(points);
});

    updateCheckinButton();
}
    // ===== 更新签到圆圈 =====
function updateCheckinDays() {

    const days = document.querySelectorAll(".check-days .day");
    
   let checkinDay = parseInt(
    localStorage.getItem("paaniCheckinDay")
) || 1;

const completed =
    localStorage.getItem("paaniCheckinCompleted") === "true";

const status = document.querySelector(".check-status");

if (status) {

    if (completed) {
        status.textContent = "¡7 días completados! 🎉";
    } else {
        status.textContent = `Día ${checkinDay} de 7`;
    }
}
    days.forEach((day, index) => {

        // 礼物不处理
        if (day.classList.contains("gift")) return;

        const dayNumber = index + 1;

        // 先清除状态
        day.classList.remove("done");
        day.classList.remove("today");

        // 恢复默认灰色
        day.style.backgroundColor = "#fff";
        day.style.borderColor = "#E5E5E5";
        day.style.color = "#888";
        day.style.transform = "scale(1)";
        day.style.boxShadow = "none";

        // 已完成 → 蓝色
       if (dayNumber < checkinDay) {
            day.classList.add("done");

            day.style.backgroundColor = "#8ED8F8";
            day.style.borderColor = "#8ED8F8";
            day.style.color = "#fff";

        }

        // 今天 → 黄色
        else if (dayNumber === checkinDay) {

            day.classList.add("today");

            day.style.backgroundColor = "#F7D86B";
            day.style.borderColor = "#F7D86B";
            day.style.color = "#333";
            day.style.transform = "scale(1.18)";
            day.style.boxShadow = "0 6px 15px rgba(247,216,107,.45)";

        }

    });
}
window.addEventListener("DOMContentLoaded", function () {
    updateCheckinDays();

    const points =
        parseInt(localStorage.getItem("paaniPoints")) || 0;

    updatePoints(points);
    updateCheckinButton();

});
    
</script>
