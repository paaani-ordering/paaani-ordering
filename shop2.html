<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda | Paaani</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#ffffff;
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    max-width:430px;
    margin:0 auto;

    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}
a{

    text-decoration:none;
    color:inherit;

}

/*================ HEADER ================*/

.header{

    padding:24px 20px 18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.greeting{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.hello{

    font-size:15px;

    color:#888;

    font-weight:700;

}

.shop-title{

    font-size:34px;

    font-weight:800;

    color:#2B2B2B;

}

.points-card{

    width:74px;

    height:74px;

    border-radius:22px;

    background:#8ED8F8;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#fff;

    box-shadow:0 12px 30px rgba(142,216,248,.35);

}

.points-num{

    font-size:26px;

    font-weight:800;

    line-height:1;

}

.points-text{

    margin-top:2px;

    font-size:13px;

    font-weight:700;

}

main{

    padding:20px;

}

/* ---------- Check-in ---------- */

.checkin{
    background:#fff;
    border-radius:26px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 12px 35px rgba(0,0,0,.06);
}

.check-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.check-title{
    font-size:22px;
    font-weight:800;
}

.check-sub{
    margin-top:6px;
    font-size:14px;
    color:#8A8A8A;
}

.check-days{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:24px 0;
}

.day{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #E8E8E8;
    background:#fff;
    color:#999;
    font-size:14px;
    font-weight:700;
    flex-shrink:0;
    transition:.25s;
}

.day.done{
    background:#8ED8F8;
    border-color:#8ED8F8;
    color:#fff;
}

.day.today{
    background:#F7D86B;
    border-color:#F7D86B;
    color:#333;
    transform:scale(1.18);
    box-shadow:0 6px 15px rgba(247,216,107,.45);
}

.day.gift{
    background:#FFF7D8;
    border-color:#FFF7D8;
    font-size:18px;
}

.line{
    width:12px;
    height:3px;
    background:#ECECEC;
    border-radius:999px;
}

.line.done{
    background:#8ED8F8;
}

.reward{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:10px;
}

.reward-left{
    display:flex;
    flex-direction:column;
}

.reward-points{
    font-size:36px;
    font-weight:800;
    color:#21B15C;
    line-height:1;
    margin-top:4px;
}

.check-btn{
    width:138px;
    height:46px;
    border:none;
    border-radius:999px;
    background:#8ED8F8;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(142,216,248,.35);
    transition:.2s;
}

.check-btn:hover{
    transform:translateY(-2px);
}

.check-btn:active{
    transform:scale(.96);
}

.check-status{
    font-size:14px;
    font-weight:700;
    color:#777;
}

/* ---------- 分类 ---------- */

.tabs{
    display:flex;
    gap:12px;
    margin:20px 0 18px;
}

.tab{
    flex:1;

    height:48px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff;
    border-radius:24px;

    font-size:17px;
    font-weight:700;
    color:#333;

    box-shadow:0 4px 12px rgba(0,0,0,.04);

    cursor:pointer;
}
.tab.active{
    background:var(--blue);
    color:#fff;
}

/* ---------- 商品 ---------- */

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}
    
.card{
    width:100%;
    min-width:0;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.05);
}

.product-image{
    height:165px;
    padding:12px;
    object-fit:contain;
}

.info{
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.name{
    font-size:16px;
    line-height:1.3;
    font-weight:800;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.description{
    margin-top:4px;
    color:#666;
    font-size:12px;
    line-height:1.3;

    display:none;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    font-size:26px;
    line-height:1;
    font-weight:800;
}

.price span{
    font-size:16px;
}

.exchange{
    width:100%;
    height:42px;

    border:none;
    border-radius:999px;

    background:var(--blue);
    color:#fff;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
    transition:.2s;
}

.exchange:active{
    transform:scale(.97);
}
.bottom-space{

    height:90px;

}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}

</style>
</head>

<body>

<header class="header">

    <div class="greeting">

        <div class="hello">
            ☀️ Buenos días
        </div>

        <div class="shop-title">
            Tienda
        </div>

    </div>

    <div class="points-card">

        <div class="points-num">
            0
        </div>

        <div class="points-text">
            pts
        </div>

    </div>

</header>

<main>

 <div class="checkin">

    <div class="check-header">

        <div>

            <div class="check-title">
                🐶 Check-in diario
            </div>

            <div class="check-sub">
                ¡Vuelve cada día para ganar más puntos!
            </div>

        </div>

        <div class="today-badge">
            +5 pts
        </div>

    </div>

    <div class="check-days">

        <div class="day done">1</div>
        <div class="line done"></div>

        <div class="day done">2</div>
        <div class="line done"></div>

        <div class="day today">3</div>
        <div class="line"></div>

        <div class="day">4</div>
        <div class="line"></div>

        <div class="day">5</div>
        <div class="line"></div>

        <div class="day">6</div>
        <div class="line"></div>

        <div class="day gift">🎁</div>

    </div>

    <div class="reward">

        <div class="reward-left">

            <div class="check-status">

                Día 3 de 7

            </div>

            <div class="reward-points">

                +5 pts

            </div>

        </div>

        <button class="check-btn">

            Check-in

        </button>

    </div>

</div>   

<div class="tabs">

    <div class="tab active" data-type="all">
        Todo
    </div>

    <div class="tab" data-type="merch">
        Merch
    </div>

    <div class="tab" data-type="coupon">
        Cupones
    </div>

</div>

<div class="products">

<!-- Supabase 动态生成 -->

</div>

<div class="bottom-space"></div>

</main>

<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a >

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a >

 <!-- 商城 -->
<a href="shop2.html" class="nav-item active">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a >

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const productsContainer = document.querySelector(".products");

let currentType = "all";

loadProducts();
    async function loadProducts() {

    const { data, error } = await supabaseClient
        .from("shop_products")
        .select("*")
        .eq("active", true)
        .order("display_order");

    if (error) {
        console.error(error);
        return;
    }
    productsContainer.innerHTML = "";

// 分类过滤
const list = data.filter(product => {

    if(currentType === "all") return true;

    return product.type === currentType;

});

list.forEach(product => {
        

  productsContainer.innerHTML += `
<div class="card">

<img class="product-image"
src="${product.image}"
alt="${product.name}">

<div class="info">

<div class="name">
${product.name}
</div>

<div class="description">
${product.description || ""}
</div>

<div class="price">
€${product.price}
</div>

<button class="exchange">
${product.points} pts
</button>

</div>

</div>
`;
});
}
 const tabs = document.querySelectorAll(".tab");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));

        tab.classList.add("active");

        currentType = tab.dataset.type;

        loadProducts();

    });

});   
</script>

</body>
</html>
