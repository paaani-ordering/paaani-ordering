<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda | Paaani</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#ffffff;
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* 背景 */    
    body {
      margin: 0 auto;
      width: 100%;
      max-width: 430px;
      font-family: Arial, sans-serif;
      background-image:   
      linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
      url("paaani-bg.png");
      background-repeat: repeat;
      background-size: 300px auto;
      background-position: top left;
}
    
    
/*================ HEADER ================*/

    
.header{

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.greeting{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.shop-title{

    font-size:34px;

    font-weight:800;

    color:#2B2B2B;

}

.points-card{

    width:74px;

    height:74px;

    border-radius:22px;

    background:#8ED8F8;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#fff;

    box-shadow:0 12px 30px rgba(142,216,248,.35);

}

.points-num{

    font-size:26px;

    font-weight:800;

    line-height:1;

}

.points-text{

    margin-top:2px;

    font-size:13px;

    font-weight:700;

}

main{

    padding:20px;

}

/* ---------- Check-in ---------- */

.checkin{
    background:#fff;
    border-radius:18px;
    padding:10px 14px;
    margin-top:-12px;
    margin-bottom:4px;
}
.check-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.check-title{
    font-size:15px;
    margin-bottom:2px;
    font-weight:800;
}

.check-sub{
    margin-top:6px;
    font-size:14px;
    color:#8A8A8A;
}
.check-desc{
    font-size:12px;
    line-height:1.2;
    margin-bottom:6px;
}

.check-days{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:14px 0 12px;
}
.day{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #E8E8E8;
    background:#fff;
    color:#999;
    font-size:15px;
    font-weight:700;
    flex-shrink:0;
    transition:.25s;
}

.day.done{
    background:#8ED8F8;
    border-color:#8ED8F8;
    color:#fff;
}

.day.today{
    background:#F7D86B;
    border-color:#F7D86B;
    color:#333;
    transform:scale(1.18);
    box-shadow:0 6px 15px rgba(247,216,107,.45);
}

.day.gift{
    background:#FFF7D8;
    border-color:#FFF7D8;
    font-size:18px;
}

.line{
    width:12px;
    height:2px;
    background:#ECECEC;
    border-radius:999px;
}

.line.done{
    background:#8ED8F8;
}

.reward{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
}

.reward-left{
    display:flex;
    flex-direction:column;
}

.reward-points{
    font-size:13px;
    font-weight:800;
    color:#21B15C;
    line-height:1;
    margin-top:4px;
}

.check-btn{
    min-width:118px;
    height:30px;
    border:none;
    border-radius:17px;
    background:#8ED8F8;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(142,216,248,.35);
    transition:.2s;
}

.check-btn:hover{
    transform:translateY(-2px);
}

.check-btn:active{
    transform:scale(.96);
}

.check-status{
    font-size:12px;
    font-weight:700;
    color:#666;
    line-height:1;
}

/* ---------- 分类 ---------- */

.tabs{
    display:flex;
    gap:10px;
    margin:10px 0 10px;
}

.tab{
    flex:1;

    height:36px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff;
    border-radius:18px;

    font-size:13px;
    font-weight:700;
    color:#333;

    box-shadow:0 4px 12px rgba(0,0,0,.04);

    cursor:pointer;
}
.tab.active{
    background:var(--blue);
    color:#fff;
}

/* ---------- 商品 ---------- */

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
    padding:0 16px 16px;
    margin-top:24px;
}
    
.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
    transition:.25s;
    width:100%;
    box-sizing:border-box;
}

.card:active{
    transform:scale(.98);
}
.product-image{
    width:90%;
    aspect-ratio:1/1;
    object-fit:contain;
    padding:2px;
    margin:0 auto;
    display:block;
}
.info{
    padding:6px 12px;
}

.name{
    font-size:12px;
    line-height:1.25;
    font-weight:700;
    color:#6395D9;
    text-align:center;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-bottom:12px;
    min-height:16px;
}

.description{
    margin-top:2px;
    color:#666;
    font-size:12px;
    line-height:1.3;

    display:none;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    font-size:22px;
    line-height:1;
    font-weight:800;
}
.points{
    display:flex;
    align-items:center;
    justify-content:center;

    margin-top:20px auto 0;

    padding:2px 10px;

    background:#FFF4C8;
    color:#C18A00;

    border-radius:999px;

    font-size:13px;
    font-weight:700;
}

.price span{
    font-size:16px;
}

.exchange{

height:44px;

border-radius:14px;

font-size:16px;

font-weight:800;

background:#8ED8F8;

box-shadow:0 6px 16px rgba(142,216,248,.35);

}
.exchange:active{
    transform:scale(.97);
}
.bottom-space{

    height:78px;

}

/* 底部导航 */
    .bottom-nav {   /* 白色导航栏 */
       position: fixed;   /* 固定在底部 */
       left: 50%;
       bottom: 0;   /* 屏幕最下面 */
       transform: translateX(-50%);
       width: 100%;   /* 手机上占宽 */
       max-width: 480px;
       height: 72px;   /* 底部导航栏高度 */
       background: #ffffff;
       border-top: 1px solid #eeeeee;   /* 分割线 */
       display: flex;  /* 四个按钮横向排列 */
       justify-content: space-around;   /* 四个按钮平均分布 */
       align-items: center;   /* 四个按钮上下居中 */
       padding-bottom: env(safe-area-inset-bottom);
       z-index: 9999;   /* 让底部导航栏处于页面最上层 */
}
   .bottom-nav a,
   .bottom-nav .nav-item {
       text-decoration: none !important;
}

    .nav-item {   /* 每个按钮 */
       flex: 1;   /* 四个按钮平均分配宽度 */
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       gap: 4px;   /* 图标和文字距离 */
       color: #9a9a9a;   /* 没选中的颜色 */
       font-size: 11px;
       font-weight: 600;   /* 文字粗细 */
       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;   /* 字体 */
       -webkit-tap-highlight-color: transparent;    /* 手机点击链接时不出现浏览器默认方块 */
}

    .nav-icon {   /* 图标 */
       position: relative;
       display: flex;
       align-items: center;
       justify-content: center;
}

    .nav-icon svg {    
       width: 23px;   /* 图标大小 */
       height: 23px;   /* 图标大小 */
       fill: none;   /* 图标内不填充颜色 */
       stroke: currentColor;   /* 图标线条颜色跟随 */
       stroke-width: 1.8;   /* 图标线条粗细 */
       stroke-linecap: round;
       stroke-linejoin: round;
}

    .nav-item.active {   /* 当前页面 */
       color: #8ed8f8;
}

     body {   /* 防止页面内容被底栏挡住 */
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
}


.sheet{
    width:100%;

<script>

const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const productsContainer = document.querySelector(".products");

let currentType = "all";

loadProducts();
    async function loadProducts() {

    const { data, error } = await supabaseClient
        .from("shop_products")
        .select("*")
        .eq("active", true)
        .order("display_order");
window.products = data;
    if (error) {
        console.error(error);
        return;
    }
    productsContainer.innerHTML = "";

// 分类过滤
const list = data.filter(product => {

    if(currentType === "all") return true;

    return (product.category || "").toLowerCase() === currentType.toLowerCase();

});

list.forEach(product => {
        

  productsContainer.innerHTML += `
<div class="card" onclick="openProduct('${product.id}')">
<img
    class="product-image"
    src="${product.image}"
    alt="${product.name}"
>

<div class="info">

<div class="name">
${product.name}
</div>

<div class="description">
${product.description || ""}
</div>

<div class="points">
    ⭐ ${product.points} pts
</div>

</div>

</div>
`;
});
}
 const tabs = document.querySelectorAll(".tab");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));

        tab.classList.add("active");

        currentType = tab.dataset.type;

        loadProducts();

    });

}); 

  document.getElementById("productSheet")?.addEventListener("click", function(e){

    if(e.target === this){
        this.style.display = "none";
    }

});
    let buyType = "points";

document.querySelectorAll(".option").forEach(item=>{

    item.onclick=function(e){

        e.stopPropagation();

        document
            .querySelectorAll(".option")
            .forEach(x=>x.classList.remove("active"));

        this.classList.add("active");

        buyType=this.dataset.type;

    };

});
    let currentProduct = null;

function openProduct(id){

    currentProduct = window.products.find(x=>x.id==id);
    console.log("当前商品 images =", currentProduct.images);
    document.getElementById("sheetImage").src=currentProduct.image;
    const gallery = document.getElementById("sheetGallery");
gallery.innerHTML = "";

// 多图左右滑动
let images = [];

if (currentProduct.images && Array.isArray(currentProduct.images)) {
    images = currentProduct.images;
} else if (currentProduct.image) {
    images = [currentProduct.image];
}

// 去重 + 清理空地址
images = [...new Set(
    images.filter(img => img && img.trim())
)];

const slider = document.createElement("div");
slider.className = "image-slider";
const counter = document.createElement("div");
counter.className = "image-counter";
counter.textContent = `1 / ${images.length}`;

counter.style.textAlign = "center";
counter.style.fontSize = "13px";
counter.style.color = "#aaa";
counter.style.marginTop = "8px";
counter.style.marginBottom = "12px";    

slider.style.setProperty("display", "flex", "important");
slider.style.setProperty("flex-direction", "row", "important");

    const sheet = document.querySelector("#productSheet .sheet");

let sheetStartY = 0;
let sheetStartX = 0;
let sheetDragging = false;

if (sheet) {
    sheet.addEventListener("touchstart", function(e) {
        sheetStartY = e.touches[0].clientY;
        sheetStartX = e.touches[0].clientX;
        sheetDragging = false;
        sheet.style.transition = "none";
    }, { passive: true });

    sheet.addEventListener("touchmove", function(e) {
        const currentY = e.touches[0].clientY;
        const currentX = e.touches[0].clientX;

        const deltaY = currentY - sheetStartY;
        const deltaX = currentX - sheetStartX;

        // 只有明显向下滑，才启动下拉
        if (deltaY > 10 && Math.abs(deltaY) > Math.abs(deltaX) * 1.2) {
            sheetDragging = true;
            sheet.style.transform = `translateY(${deltaY}px)`;
        }
    }, { passive: true });

    sheet.addEventListener("touchend", function() {
        if (!sheetDragging) {
            sheet.style.transition = "";
            return;
        }

        const currentTransform = sheet.style.transform;
        const match = currentTransform.match(/translateY\(([-\d.]+)px\)/);
        const deltaY = match ? parseFloat(match[1]) : 0;

        if (deltaY > 120) {
            sheet.style.transition = "transform 0.25s ease";
            sheet.style.transform = "translateY(100%)";

            setTimeout(() => {
                document.getElementById("productSheet").style.display = "none";
                sheet.style.transform = "";
                sheet.style.transition = "";
            }, 250);
        } else {
            sheet.style.transition = "transform 0.25s ease";
            sheet.style.transform = "translateY(0)";

            setTimeout(() => {
                sheet.style.transition = "";
            }, 250);
        }

        sheetDragging = false;
    }, { passive: true });
}
}

function updateCheckinDays() {

    const days = document.querySelectorAll(".check-days .day");
    
   let checkinDay = parseInt(
    localStorage.getItem("paaniCheckinDay")
) || 1;

const completed =
    localStorage.getItem("paaniCheckinCompleted") === "true";

const status = document.querySelector(".check-status");

if (status) {

    if (completed) {
        status.textContent = "¡7 días completados! 🎉";
    } else {
        status.textContent = `Día ${checkinDay} de 7`;
    }
}
    days.forEach((day, index) => {

        // 礼物不处理
        if (day.classList.contains("gift")) return;

        const dayNumber = index + 1;

        // 先清除状态
        day.classList.remove("done");
        day.classList.remove("today");

        // 恢复默认灰色
        day.style.backgroundColor = "#fff";
        day.style.borderColor = "#E5E5E5";
        day.style.color = "#888";
        day.style.transform = "scale(1)";
        day.style.boxShadow = "none";

        // 已完成 → 蓝色
       if (dayNumber < checkinDay) {
            day.classList.add("done");

            day.style.backgroundColor = "#8ED8F8";
            day.style.borderColor = "#8ED8F8";
            day.style.color = "#fff";

        }

        // 今天 → 黄色
        else if (dayNumber === checkinDay) {

            day.classList.add("today");

            day.style.backgroundColor = "#F7D86B";
            day.style.borderColor = "#F7D86B";
            day.style.color = "#333";
            day.style.transform = "scale(1.18)";
            day.style.boxShadow = "0 6px 15px rgba(247,216,107,.45)";

        }

    });
}
