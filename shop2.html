<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tienda | Paaani</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --blue:#8ED8F8;
    --yellow:#F7D86B;
    --cream:#FFF9EC;
    --text:#2B2B2B;
    --gray:#888;
    --card:#ffffff;
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    max-width:430px;
    margin:0 auto;

    font-family:'Nunito',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}
a{

    text-decoration:none;
    color:inherit;

}

/*================ HEADER ================*/

.header{

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.greeting{

    display:flex;

    flex-direction:column;

    gap:4px;

}

.shop-title{

    font-size:34px;

    font-weight:800;

    color:#2B2B2B;

}

.points-card{

    width:74px;

    height:74px;

    border-radius:22px;

    background:#8ED8F8;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#fff;

    box-shadow:0 12px 30px rgba(142,216,248,.35);

}

.points-num{

    font-size:26px;

    font-weight:800;

    line-height:1;

}

.points-text{

    margin-top:2px;

    font-size:13px;

    font-weight:700;

}

main{

    padding:20px;

}

/* ---------- Check-in ---------- */

.checkin{
    background:#fff;
    border-radius:18px;
    padding:10px 14px;
    margin-top:-12px;
    margin-bottom:4px;
}
.check-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.check-title{
    font-size:15px;
    margin-bottom:2px;
    font-weight:800;
}

.check-sub{
    margin-top:6px;
    font-size:14px;
    color:#8A8A8A;
}
.check-desc{
    font-size:12px;
    line-height:1.2;
    margin-bottom:6px;
}

.check-days{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:14px 0 12px;
}
.day{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #E8E8E8;
    background:#fff;
    color:#999;
    font-size:15px;
    font-weight:700;
    flex-shrink:0;
    transition:.25s;
}

.day.done{
    background:#8ED8F8;
    border-color:#8ED8F8;
    color:#fff;
}

.day.today{
    background:#F7D86B;
    border-color:#F7D86B;
    color:#333;
    transform:scale(1.18);
    box-shadow:0 6px 15px rgba(247,216,107,.45);
}

.day.gift{
    background:#FFF7D8;
    border-color:#FFF7D8;
    font-size:18px;
}

.line{
    width:12px;
    height:2px;
    background:#ECECEC;
    border-radius:999px;
}

.line.done{
    background:#8ED8F8;
}

.reward{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
}

.reward-left{
    display:flex;
    flex-direction:column;
}

.reward-points{
    font-size:13px;
    font-weight:800;
    color:#21B15C;
    line-height:1;
    margin-top:4px;
}

.check-btn{
    min-width:118px;
    height:30px;
    border:none;
    border-radius:17px;
    background:#8ED8F8;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(142,216,248,.35);
    transition:.2s;
}

.check-btn:hover{
    transform:translateY(-2px);
}

.check-btn:active{
    transform:scale(.96);
}

.check-status{
    font-size:12px;
    font-weight:700;
    color:#666;
    line-height:1;
}

/* ---------- 分类 ---------- */

.tabs{
    display:flex;
    gap:10px;
    margin:10px 0 10px;
}

.tab{
    flex:1;

    height:36px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#fff;
    border-radius:18px;

    font-size:13px;
    font-weight:700;
    color:#333;

    box-shadow:0 4px 12px rgba(0,0,0,.04);

    cursor:pointer;
}
.tab.active{
    background:var(--blue);
    color:#fff;
}

/* ---------- 商品 ---------- */

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
    padding:0 16px 16px;
    margin-top:24px;
}
    
.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
    transition:.25s;
    width:100%;
    box-sizing:border-box;
}

.card:active{
    transform:scale(.98);
}
.product-image{
    width:90%;
    aspect-ratio:1/1;
    object-fit:contain;
    padding:2px;
    margin:0 auto;
    display:block;
}
.info{
    padding:6px 12px;
}

.name{
    font-size:12px;
    line-height:1.25;
    font-weight:700;
    color:#6395D9;
    text-align:center;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;

    min-height:16px;
}

.description{
    margin-top:2px;
    color:#666;
    font-size:12px;
    line-height:1.3;

    display:none;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    font-size:22px;
    line-height:1;
    font-weight:800;
}
.points{
    display:flex;
    align-items:center;
    justify-content:center;

    margin-top:20px auto 0;

    padding:2px 10px;

    background:#FFF4C8;
    color:#C18A00;

    border-radius:999px;

    font-size:13px;
    font-weight:700;
}

.price span{
    font-size:16px;
}

.exchange{

height:44px;

border-radius:14px;

font-size:16px;

font-weight:800;

background:#8ED8F8;

box-shadow:0 6px 16px rgba(142,216,248,.35);

}
.exchange:active{
    transform:scale(.97);
}
.bottom-space{

    height:78px;

}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;
  height: 72px;

  background: #ffffff;
  border-top: 1px solid #eeeeee;

  display: flex;
  justify-content: space-around;
  align-items: center;

  padding-bottom: env(safe-area-inset-bottom);

  z-index: 9999;
}

/* 每个按钮 */
.nav-item {
  flex: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  text-decoration: none;

  color: #9a9a9a;

  font-size: 11px;
  font-weight: 600;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
  -webkit-tap-highlight-color: transparent;
}

/* 图标 */
.nav-icon {
  position: relative;

  width: 23px;
  height: 23px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-icon svg {
  width: 23px;
  height: 23px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 当前页面 */
.nav-item.active {
  color: #8ed8f8;
}
.sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);

    display:none;
    align-items:flex-end;

    z-index:999;
}

.sheet{
    width:100%;
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:24px;

    animation:up .25s;
}

@keyframes up{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.sheet-bar{
    width:42px;
    height:5px;
    background:#ddd;
    border-radius:999px;
    margin:auto;
    margin-bottom:20px;
}
    .sheet img{
    width:180px;
    height:180px;
    object-fit:contain;
    display:block;
    margin:10px auto 20px;
}

.sheet h2{
    text-align:center;
    font-size:22px;
    margin-bottom:14px;
}

.option{
    border:2px solid #eee;
    border-radius:18px;
    padding:16px;
    margin-top:12px;
    cursor:pointer;
    font-weight:700;
}

.option.active{
    border-color:#8ED8F8;
    background:#F3FBFF;
}

.continue-btn{
    width:100%;
    margin-top:24px;
    height:54px;
    border:none;
    border-radius:999px;
    background:#8ED8F8;
    color:#fff;
    font-size:17px;
    font-weight:800;
}
</style>
</head>

<body>

<header class="header">

    <div class="greeting">

        <div class="shop-title">
            Tienda
        </div>

    </div>

    <div class="points-card">

        <div class="points-num" id="pointsNum">
    0
</div>

        <div class="points-text">
            pts
        </div>

    </div>

</header>

<main>

 <div class="checkin">

    <div class="check-header">

        <div>

            <div class="check-title">
                🐶 Check-in diario
            </div>

        </div>

        <div class="today-badge">
            +5 pts
        </div>

    </div>

    <div class="check-days">

       <div class="day">1</div>
       <div class="line"></div>

       <div class="day">2</div>
       <div class="line"></div>

       <div class="day">3</div>
       <div class="line"></div>

        <div class="day">4</div>
        <div class="line"></div>

        <div class="day">5</div>
        <div class="line"></div>

        <div class="day">6</div>
        <div class="line"></div>

        <div class="day gift">🎁</div>

    </div>

    <div class="reward">

        <div class="reward-left">

            <div class="check-status">

                Día 1 de 7

            </div>

        </div>

       <button class="check-btn" onclick="doCheckIn()">
    Check-in
</button>

            Check-in

        </button>

    </div>

</div>   

<div class="tabs">

    <div class="tab active" data-type="all">
        Todo
    </div>

    <div class="tab" data-type="merch">
        Merch
    </div>

    <div class="tab" data-type="coupon">
        Cupones
    </div>

</div>

<div class="products">

<!-- Supabase 动态生成 -->

</div>

<div class="bottom-space"></div>

</main>

<!-- 底部导航 -->
<nav class="bottom-nav">

  <!-- 首页 -->
  <a href="index.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z"/>
      </svg>
    </span>
    <span>Inicio</span>
  </a >

  <!-- 菜单 -->
  <a href="menu.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16M4 12h16M4 19h16"/>
      </svg>
    </span>
    <span>Menú</span>
  </a >

 <!-- 商城 -->
<a href="shop2.html" class="nav-item active">
    <span class="nav-icon nav-shop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7L7 20H17L18 7"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
    </span>

    <span>Tienda</span>
</a>

  <!-- 会员 -->
  <a href="account.html" class="nav-item">
    <span class="nav-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 21c.7-4.2 3.2-6.5 7.5-6.5s6.8 2.3 7.5 6.5"/>
      </svg>
    </span>
    <span>Mi cuenta</span>
  </a >

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://oevwuadmtzujngtmkkbw.supabase.co";
const supabaseKey = "sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl";

const supabaseClient = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);
const productsContainer = document.querySelector(".products");

let currentType = "all";

loadProducts();
    async function loadProducts() {

    const { data, error } = await supabaseClient
        .from("shop_products")
        .select("*")
        .eq("active", true)
        .order("display_order");
window.products = data;
    if (error) {
        console.error(error);
        return;
    }
    productsContainer.innerHTML = "";

// 分类过滤
const list = data.filter(product => {

    if(currentType === "all") return true;

    return (product.category || "").toLowerCase() === currentType.toLowerCase();

});

list.forEach(product => {
        

  productsContainer.innerHTML += `
<div class="card" onclick="openProduct(${product.id})">

<img
    class="product-image"
    src="${product.image}"
    alt="${product.name}"
>

<div class="info">

<div class="name">
${product.name}
</div>

<div class="description">
${product.description || ""}
</div>

<div class="points">
    ⭐ ${product.points} pts
</div>

</div>

</div>
`;
});
}
 const tabs = document.querySelectorAll(".tab");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));

        tab.classList.add("active");

        currentType = tab.dataset.type;

        loadProducts();

    });

}); 

  document.getElementById("productSheet").onclick = function(e){

    if(e.target === this){
        this.style.display = "none";
    }

};
    let buyType = "points";

document.querySelectorAll(".option").forEach(item=>{

    item.onclick=function(e){

        e.stopPropagation();

        document
            .querySelectorAll(".option")
            .forEach(x=>x.classList.remove("active"));

        this.classList.add("active");

        buyType=this.dataset.type;

    };

});
    let currentProduct = null;

function openProduct(id){

    currentProduct = window.products.find(x=>x.id==id);

    document.getElementById("sheetImage").src=currentProduct.image;
    document.getElementById("sheetName").innerText=currentProduct.name;
    document.getElementById("sheetPoints").innerText=
        "⭐ "+currentProduct.points+" pts";
    document.getElementById("sheetPrice").innerText=
        "€"+currentProduct.price;

    document.getElementById("productSheet").style.display="flex";
}

document.querySelector(".continue-btn").onclick=function(){

    location.href=
    `checkout.html?id=${currentProduct.id}&type=${buyType}`;

};
   function doCheckIn() {
    let checkinDay = parseInt(localStorage.getItem("paaniCheckinDay")) || 1;
    let points = parseInt(localStorage.getItem("paaniPoints")) || 0;

    const today = new Date().toDateString();
    const lastCheckin = localStorage.getItem("paaniLastCheckin");

    // 今天已经签到
    if (lastCheckin === today) {
        alert("Hoy ya has hecho check-in ✅");
        return;
    }

    // 7天完成
    if (checkinDay > 7) {
        alert("¡Ya completaste los 7 días! 🎁");
        return;
    }

    // 签到
    points += 5;

    // 今天签到记录
    localStorage.setItem("paaniLastCheckin", today);

    // 如果是第7天，完成7天
    if (checkinDay === 7) {
        localStorage.setItem("paaniCheckinDay", "8");
    } else {
        localStorage.setItem("paaniCheckinDay", checkinDay + 1);
    }

    localStorage.setItem("paaniPoints", points);

    // 更新页面
    document.querySelector(".check-status").textContent =
        `Día ${checkinDay} de 7`;

    const pointsBox = document.querySelector(".points-num");

    if (pointsBox) {
        pointsBox.textContent = points;
    }
    updateCheckinDays();
    alert("+5 pts 🎉");
}
    // ===== 更新签到圆圈 =====
function updateCheckinDays() {

    const days = document.querySelectorAll(".check-days .day");

    const checkinDay =
        parseInt(localStorage.getItem("paaniCheckinDay")) || 1;

    days.forEach((day, index) => {

        if (day.classList.contains("gift")) return;

        const dayNumber = index + 1;

        /* 先全部恢复灰色 */
        day.classList.remove("done");
        day.classList.remove("today");

        day.style.backgroundColor = "#fff";
        day.style.borderColor = "#E5E5E5";
        day.style.color = "#888";
        day.style.transform = "scale(1)";
        day.style.boxShadow = "none";

        /* 已经签到的天数 */
        if (dayNumber < checkinDay) {

            day.classList.add("done");

            day.style.backgroundColor = "#8ED8F8";
            day.style.borderColor = "#8ED8F8";
            day.style.color = "#fff";
        }

        /* 今天 */
        if (dayNumber === checkinDay) {

            day.classList.add("today");

            day.style.backgroundColor = "#F7D86B";
            day.style.borderColor = "#F7D86B";
            day.style.color = "#333";
            day.style.transform = "scale(1.18)";
            day.style.boxShadow = "0 6px 15px rgba(247,216,107,.45)";
        }
    });
}
window.addEventListener("DOMContentLoaded", function () {
    updateCheckinDays();
});    

// 页面打开时更新
updateCheckinDays();
</script>
<div id="productSheet" class="sheet-overlay">

  <div class="sheet">

    <div class="sheet-bar"></div>

    <img id="sheetImage">

    <h2 id="sheetName"></h2>
    <p id="sheetDescription"></p>

    <div id="sheetPoints" class="points"></div>

    <div class="option active" data-type="points">
      ⭐ 积分兑换
    </div>

    <div class="option" data-type="buy">
      💳 现金购买
      <span id="sheetPrice"></span>
    </div>

    <button class="continue-btn">
      Continuar
    </button>

  </div>

</div>
</body>
</html>
