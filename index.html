<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paaani Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f5;
      color: #222;
    }

    header {
      background: #8ed8f8;
      padding: 28px 20px;
      text-align: center;
    }

    .header-logo {
  width: 160px;
  height: auto;
  display: block;
  margin: 0 auto 8px;
}

    header p {
      margin: 8px 0 0;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 18px 15px;
    }

    .categories button {
      border: none;
      background: white;
      padding: 11px 18px;
      border-radius: 25px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .categories button.active {
      background: #222;
      color: white;
    }

    .menu {
      padding: 0 15px 100px;
      max-width: 600px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 14px;
    }

    .info {
      flex: 1;
    }

    .info h3 {
      margin: 0 0 7px;
    }

    .description {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
    }

    .add {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffd84d;
      font-size: 24px;
      cursor: pointer;
    }

    .cart {
      position: fixed;
      bottom: 18px;
      left: 15px;
      right: 15px;
      max-width: 570px;
      margin: auto;
      background: #222;
      color: white;
      padding: 16px 20px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<header>
  <img class="header-logo" src="https://oevwuadmtzujngtmkkbw.supabase.co/storage/v1/object/public/product-images/logo-bai.png" alt="Paaani">
  <p>¿Qué te apetece hoy?</p >
</header>

<div class="categories">
  <button class="active" data-category="all">Todos</button>

  <button data-category="a6fca325-d92c-4475-9254-7a9e512cb240">
    Bebida
  </button>

  <button data-category="7fb4cb63-be76-477c-8204-7d3a9cb851d8">
    Postre
  </button>

  <button data-category="ade5d730-ee05-478d-9406-54427f06956d">
    Desayuno
  </button>

  <button data-category="5684d15f-811c-4124-9e91-f5843d5ef2b8">
    Ensalada
  </button>

  <button data-category="3ccae3bb-3595-4b78-b5f9-a5c5c108c747">
    Merch
  </button>
</div>

<div class="menu">

</div>

<div class="cart">
  <span>🛒 Mi pedido</span>
  <span>0 productos</span>
</div>

<script>
const SUPABASE_URL = 'https://oevwuadmtzujngtmkkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

let cart = {};
let allProducts = [];

// 价格格式
function formatPrice(price) {
  return `${Number(price).toFixed(2).replace('.', ',')} €`;
}

// 从 Supabase 读取商品
async function loadProducts() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(`Error ${response.status}`);
    }

    const products = await response.json();

    allProducts = products;

    renderProducts(allProducts);
  } catch (error) {
    console.error('Error al cargar productos:', error);

    document.querySelector('.menu').innerHTML = `
      <p>No se pudieron cargar los productos.</p >
    `;
  }
}

// 显示商品
function renderProducts(products) {
  const menu = document.querySelector('.menu');

  menu.innerHTML = '';

  products.forEach(product => {
    const item = document.createElement('div');

    item.className = 'product';

    item.innerHTML = `
      ${
        product.image_url
          ? `<img src="${product.image_url}" alt="${product.name}">`
          : ''
      }

      <div class="info">
        <h3>${product.name}</h3>

        <div class="description">
          ${product.description || ''}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
        </div>
      </div>

      <button class="add" type="button">+</button>
    `;

    item.querySelector('.add').addEventListener('click', () => {
      addToCart(product);
    });

    menu.appendChild(item);
  });
}

// 分类按钮
document.querySelectorAll('.categories button').forEach(button => {
  button.addEventListener('click', () => {

    document.querySelectorAll('.categories button').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');

    const category = button.dataset.category;

    if (category === 'all') {
      renderProducts(allProducts);
      return;
    }

    const filteredProducts = allProducts.filter(product => {
      return product.category_id === category;
    });

    renderProducts(filteredProducts);
  });
});

// 加入购物车
function addToCart(product) {
  if (cart[product.id]) {
    cart[product.id].quantity += 1;
  } else {
    cart[product.id] = {
      ...product,
      quantity: 1
    };
  }

  updateCartBar();
}

// 修改数量
function changeQuantity(id, amount) {
  if (!cart[id]) return;

  cart[id].quantity += amount;

  if (cart[id].quantity <= 0) {
    delete cart[id];
  }

  updateCartBar();
  renderCart();
}

// 商品总数量
function getCartCount() {
  return Object.values(cart).reduce(
    (total, product) => total + product.quantity,
    0
  );
}

// 总价
function getCartTotal() {
  return Object.values(cart).reduce(
    (total, product) =>
      total + Number(product.price) * product.quantity,
    0
  );
}

// 更新底部购物车
function updateCartBar() {
  const count = getCartCount();

  const cartText =
    document.querySelector('.cart span:last-child');

  cartText.textContent =
    `${count} ${count === 1 ? 'producto' : 'productos'} · ${formatPrice(getCartTotal())}`;
}

// 打开购物车
function openCart() {
  renderCart();

  document.getElementById('cartOverlay').style.display = 'flex';
}

// 关闭购物车
function closeCart() {
  document.getElementById('cartOverlay').style.display = 'none';
}

// 显示购物车内容
function renderCart() {
  const cartItems =
    document.getElementById('cartItems');

  const products =
    Object.values(cart);

  if (products.length === 0) {
    cartItems.innerHTML = `
      <p style="
        text-align:center;
        color:#777;
        padding:30px 0;
      ">
        Tu pedido está vacío
      </p >
    `;
  } else {
    cartItems.innerHTML = products.map(product => `
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">

        ${
          product.image_url
            ? `
              <img
                src="${product.image_url}"
                alt="${product.name}"
                style="
                  width:60px;
                  height:60px;
                  object-fit:cover;
                  border-radius:12px;
                "
              >
            `
            : ''
        }

        <div style="flex:1;">
          <strong>${product.name}</strong>

          <div style="margin-top:5px;">
            ${formatPrice(product.price)}
          </div>
        </div>

        <button
          type="button"
          onclick="changeQuantity('${product.id}', -1)"
          style="
            width:34px;
            height:34px;
            border:none;
            border-radius:50%;
            font-size:20px;
          "
        >
          −
        </button>

        <strong>${product.quantity}</strong>

        <button
          type="button"
          onclick="changeQuantity('${product.id}', 1)"
          style="
            width:34px;
            height:34px;
            border:none;
            border-radius:50%;
            background:#ffd84d;
            font-size:20px;
          "
        >
          +
        </button>

      </div>
    `).join('');
  }

  document.getElementById('cartTotal').textContent =
    formatPrice(getCartTotal());
}

// 点击底部购物车
document.querySelector('.cart').addEventListener('click', openCart);

// 创建购物车弹窗
document.body.insertAdjacentHTML('beforeend', `
  <div
    id="cartOverlay"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:999;
      align-items:flex-end;
      justify-content:center;
    "
  >

    <div
      style="
        background:white;
        width:100%;
        max-width:600px;
        max-height:85vh;
        overflow:auto;
        border-radius:24px 24px 0 0;
        padding:20px;
      "
    >

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;
      ">

        <h2 style="margin:0;">
          Mi pedido
        </h2>

        <button
          type="button"
          onclick="closeCart()"
          style="
            border:none;
            background:none;
            font-size:28px;
          "
        >
          ×
        </button>

      </div>

      <div id="cartItems"></div>

      <div style="
        display:flex;
        justify-content:space-between;
        font-size:20px;
        font-weight:bold;
        padding-top:20px;
      ">

        <span>Total</span>

        <span id="cartTotal">
          0,00 €
        </span>

      </div>

      <button
        id="checkoutButton"
        type="button"
        style="
          display:block;
          width:100%;
          margin-top:20px;
          padding:17px;
          border:none;
          border-radius:16px;
          background:#ffd84d;
          color:#222;
          font-size:17px;
          font-weight:bold;
          cursor:pointer;
        "
      >
        Confirmar pedido
      </button>

    </div>
  </div>
`);

// 开始加载商品
loadProducts();
</script>
</body>
</html>
