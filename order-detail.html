<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Paaani | Las Palmas</title>

<style>

/* ========================
   页面基础
======================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #59616c;
  font-family: Arial, sans-serif;
}


/* ========================
   顶部
======================== */

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 18px 20px 10px;
}

.detail-header h1 {
  margin: 0;

  font-size: 23px;
  font-weight: 800;

  color: #59616c;
}

.back-button {
  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: #f5f5f5;

  font-size: 20px;

  cursor: pointer;
}

.header-space {
  width: 38px;
}


/* ========================
   详情主体
======================== */

.order-detail {
  padding: 16px 20px 40px;
}


/* ========================
   商品区域
======================== */

.detail-products {
  margin-top: 14px;
}

.detail-product {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px 0;
}


/* 商品图片 */

.detail-product-image {
  width: 72px;
  height: 72px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 14px;

  background: #f7f7f7;
}


/* 没图片 */

.detail-product-placeholder {
  width: 72px;
  height: 72px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background: #f7f7f7;

  font-size: 25px;
}


/* 商品文字 */

.detail-product-left {
  flex: 1;
  min-width: 0;
}

.detail-product-name {
  margin-bottom: 5px;

  font-size: 14px;
  font-weight: 700;

  color: #59616c;
}

.detail-product-info {
  font-size: 12px;

  color: #a0a0a0;
}

.detail-product-total {
  flex-shrink: 0;

  font-size: 14px;
  font-weight: 700;

  color: #59616c;
}

</style>
  
</head>

<body>
  <div class="order-detail-page">

    
<!-- 顶部 -->
    <header class="detail-header">
      <button
        class="back-button"
        type="button"
        onclick="history.back()"
      >
        ←
      </button>

      <h1>
        Detalle del pedido
      </h1>

      <div class="header-space"></div>
      
    </header>

<!-- 订单详情 -->
    <main
      class="order-detail"
      id="orderDetail"
    >

      <div class="loading">
        Cargando pedido...
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

// ========================
// Supabase
// ========================

    const SUPABASE_URL =
      'https://oevwuadmtzujngtmkkbw.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_yL30qZT99AOR3N06YWyDWw_0be5OtGl';

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

// ========================
// 获取订单 ID
// ========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const orderId =
      params.get('id');

    console.log(
      '当前订单 ID:',
      orderId
    );

// ========================
// 金额格式
// ========================

function formatPrice(value) {
  return `${Number(value || 0)
    .toFixed(2)
    .replace('.', ',')} €`;
}

// ========================
// 日期格式
// ========================

function formatDate(value) {
  if (!value) {
    return '';
  }
  const date =
    new Date(value);
  return date.toLocaleString(
    'es-ES',
    {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  );
}

// ========================
// 订单状态
// ========================

function getStatusText(order) {
  if (
    order.payment_status === 'paid'
  ) {
    return 'Completado';
  }
    return 'Pendiente';
}

// ========================
// 读取订单详情
// ========================

async function loadOrderDetail() {
  const orderDetail =
    document.getElementById(
      'orderDetail'
    );

// ========================
// 没有订单 ID
// ========================

  if (!orderId) {
    orderDetail.innerHTML = `
      <div>
        Pedido no encontrado.
      </div>
    `;
    return;
  }
    try {

// ========================
// 当前用户
// ========================

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient
        .auth
        .getUser();

    if (userError) {
      throw userError;
    }

    if (!user) {
      orderDetail.innerHTML = `
        <div>
          Inicia sesión para ver
          este pedido.
        </div>
      `;
      return;
    }

// ========================
// 读取订单
// ========================

    const {
      data: order,
      error: orderError
    } =
      await supabaseClient
        .from('orders')
        .select(`
          id,
          order_number,
          order_type,
          status,
          payment_status,
          total_amount,
          created_at
        `)
        .eq(
          'id',
          orderId
        )
        .eq(
          'user_id',
          user.id
        )
        .single();

    if (orderError) {
      throw orderError;
    }

// ========================
// 获得积分
// 金额 × 10
// ========================

    const earnedPoints =
      Math.floor(
        Number(
          order.total_amount || 0
        ) * 10
      );

// ========================
// 读取订单商品
// ========================

const {
  data: items,
  error: itemsError
} =
  await supabaseClient
    .from('order_items')
    .select(`
      product_id,
      product_name,
      quantity,
      unit_price,
      line_total
    `)
    .eq(
      'order_id',
      orderId
    );

if (itemsError) {
  throw itemsError;
}

// ========================
// 获取商品图片
// ========================

const productIds =
  [
    ...new Set(
      (items || [])
        .map(
          item => item.product_id
        )
        .filter(Boolean)
    )
  ];

let imageMap = {};

if (productIds.length > 0) {

  const {
    data: products,
    error: productsError
  } =
    await supabaseClient
      .from('products')
      .select(`
        id,
        image_url
      `)
      .in(
        'id',
        productIds
      );

  if (!productsError) {

    (products || [])
      .forEach(product => {
        imageMap[
          product.id
        ] =
          product.image_url;

      });
  }
}
      
// ========================
// 生成商品 HTML
// ========================

let productsHTML = '';

if (
  items &&
  items.length > 0
) {

  productsHTML =
    items
      .map(item => `
        <div class="detail-product">

  ${
    imageMap[item.product_id]
      ? `
        <img
          class="detail-product-image"
          src="${imageMap[item.product_id]}"
          alt="${item.product_name || ''}"
        >
      `
      : `
        <div class="detail-product-placeholder">
          ☕
        </div>
      `
  }

  <div class="detail-product-left">
            <div class="detail-product-name">
              ${
                item.product_name
                || 'Producto'
              }
            </div>

            <div class="detail-product-info">

              ${
                formatPrice(
                  item.unit_price
                )
              }
              ×
              ${
                item.quantity || 1
              }
            </div>
          </div>

          <div class="detail-product-total">

            ${
              formatPrice(
                item.line_total
              )
            }

          </div>
        </div>
      `)
      .join('');
} else {
  productsHTML = `
    <div>
      Sin productos.
    </div>
  `;
}

// ========================
// 显示基本信息
// ========================
    orderDetail.innerHTML = `
      <section class="detail-card">
<div>
  Productos
</div>

<div class="detail-products">

  ${productsHTML}

</div>


<hr>

        <div>

          Estado

        </div>


        <strong>

          ${
            getStatusText(
              order
            )
          }

        </strong>



        <hr>



        <div>

          Puntos obtenidos

        </div>


        <strong>

          +${earnedPoints} pts

        </strong>



        <hr>



        <div>

          Total

        </div>


        <strong>

          ${
            formatPrice(
              order.total_amount
            )
          }

        </strong>



        <hr>



        <div>

          Fecha del pedido

        </div>


        <strong>

          ${
            formatDate(
              order.created_at
            )
          }

        </strong>



        <hr>



        <div>

          Número de pedido

        </div>


        <strong>

          ${
            order.order_number
            || '-'
          }

        </strong>


      </section>


    `;


  } catch (error) {


    console.error(
      'Error cargando pedido:',
      error
    );


    orderDetail.innerHTML = `

      <div>
        No se pudo cargar
        el pedido.
      </div>

    `;


  }

}



// ========================
// 页面打开
// ========================

loadOrderDetail();   


  </script>


</body>

</html>
